      <button class="btn secondary" id="bStop" style="margin-top:10px">Stop and discard</button>
      <p class="cue" style="margin:8px 2px 0">${armed
        ? 'The chime is set for '+MED_MIN+' minutes from the start. Take the phone off silent — iPhone mutes web audio when the ring switch is off.'
        : 'The app restarted, so the chime needs one tap to arm again.'}</p>`;
    $('#tSub').textContent=[afterWake?'within 5 min of waking':null,outside?'outside':null]
      .filter(Boolean).join(' · ')||'quiet ten minutes';
    if($('#bArm')) $('#bArm').onclick=()=>{
      const ctx=armAudio();
      if(ctx){ const left=Math.max(0,startedAt+MED_MIN*60000-Date.now());
        cancelBell(); scheduleBell(ctx,ctx.currentTime+left/1000); }
      runView(startedAt);
    };
    $('#bStop').onclick=()=>{ if(!confirm('Discard this meditation?')) return;
      cancelBell(); stop(); clearRun(); nav('home'); };
    const total=MED_MIN*60000;
    const paint=()=>{
      const left=Math.max(0,startedAt+total-Date.now());
      const sec=Math.ceil(left/1000);
      const el=$('#tClock'); if(!el) return stop();
      el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
      $('#tFill').style.width=(100*(1-left/total)).toFixed(1)+'%';
      /* the bell is already on the audio clock; only ring here if it is not */
      if(left<=0){ const live=audioLive(); stop(); if(!live) chime(); done(true); }
    };
    paint(); if(!tick) tick=setInterval(paint,250);
    keepAwake(true);
  };
  if(run){
    /* a session was already running — it may even have finished while we were away */
    if(Date.now()>=run.startedAt+MED_MIN*60000){ if(!medBell.length) chime(); done(true); return; }
    runView(run.startedAt); return;
  }
  const count=S.entries.filter(e=>e.type==='meditation').length;
  setBar(edit?'Edit meditation':'Meditation','home');
  M.innerHTML=`
    <div class="card">
      <div class="medq"><span>Within 5 minutes of waking</span><button class="qtog" id="qWake">No</button></div>
      <div class="medq"><span>Outside in the sun</span><button class="qtog" id="qSun">No</button></div>
      <div class="medscore" id="medScore"></div>
    </div>`+(edit?
    `<div class="btnrow"><button class="btn secondary" id="bCancel">Cancel</button><button class="btn" id="bSave">Save</button></div>`:
    `<button class="btn" id="bStart">Start meditation · ${MED_MIN} min</button>
     <button class="btn secondary" id="bLog" style="margin-top:10px">Log one without the timer</button>
     <button class="btn secondary" id="bTest" style="margin-top:10px">Test the chime</button>
     ${count?`<button class="btn secondary" id="bLogs" style="margin-top:10px">Meditation log · ${count}</button>`:''}
     <p class="cue" style="margin:10px 2px 0">The chime only sounds with the ring switch on — iPhone mutes web audio on silent. Tap Test the chime to check.</p>`);
  const score=()=>{ const p=medPoints({afterWake,outside});
    $('#medScore').textContent='Worth '+p+' point'+(p>1?'s':'')+' of 3'; };
  const wire=(id,get,set)=>{
    const btn=$(id);
    const paint=()=>{ btn.textContent=get()?'Yes':'No'; btn.classList.toggle('on',get()); score(); };
    btn.onclick=()=>{ set(!get()); paint(); };
    paint();
  };
  wire('#qWake',()=>afterWake,v=>afterWake=v);
  wire('#qSun',()=>outside,v=>outside=v);
  if(edit){
    $('#bCancel').onclick=()=>nav('entry/'+edit.id);
    $('#bSave').onclick=async()=>{
      edit.afterWake=afterWake; edit.outside=outside; edit.points=medPoints(edit);
      await saveEntry(edit); toast('Saved'); nav('entry/'+edit.id);
    };
    return;
  }
  const testBtn=()=>{
    const b=$('#bTest'); if(!b) return;
    b.textContent=bellRinging()?'Stop the chime':'Test the chime';
  };
  $('#bTest').onclick=()=>{
    if(bellRinging()){ cancelBell(); testBtn(); return; }
    armAudio(); chime(); testBtn();
    setTimeout(testBtn,13600);
    toast('If you hear nothing, check the ring switch');
  };
  if($('#bLogs')) $('#bLogs').onclick=()=>nav('medlog');
  $('#bStart').onclick=()=>{
    const ctx=armAudio();                       /* unlock audio on the tap */
    cancelBell();
    if(ctx) scheduleBell(ctx,ctx.currentTime+MED_MIN*60);
    const startedAt=Date.now();
    writeRun({startedAt,afterWake,outside});
    runView(startedAt);
  };
  $('#bLog').onclick=()=>done(false);
}

/* ================= fitness coach =================
   The whole training history fits in one prompt - a year of sessions is under
   20k tokens against a million-token window - so there is no retrieval here and
   no summarising. Everything goes in, verbatim, every time, and prompt caching
   keeps the repeat cost of that down to a tenth. */
const AI_MODEL='claude-opus-5';
const AI_URL='https://api.anthropic.com/v1/messages';
const AI_MAXSESS=20;                 /* readings kept on the phone */

const aiKey=()=>kvGet('aiKey');
const aiAbout=()=>kvGet('aiAbout').then(v=>v||'');
/* Things he has told the coach in conversation. He should never have to say the
   same thing twice, so the coach writes these itself, with a tool, the moment he
   mentions something that will still be true next month. */
const aiFacts=()=>kvGet('aiFacts').then(v=>Array.isArray(v)?v:[]);
const AI_TOOLS=[{
  name:'remember',
  description:'Save something André has told you that will still be true next time — his equipment, '+
    'his schedule, an injury, a preference, a goal, what a clinician has told him, anything that '+
    'would otherwise make him repeat himself. Call this the moment he says it, without asking '+
    'permission first, and then carry on with your answer. Saved facts are put in front of you at '+
    'the start of every future conversation. Do not save one-off details like today\'s soreness or '+
    'a single session\'s numbers — the app already sends you all of his training data. If something '+
    'you were told before is now wrong, save the corrected version and say that you have.',
  input_schema:{
    type:'object',
    properties:{fact:{type:'string',
      description:'One self-contained sentence, written so it still makes sense read cold in six '+
        'months. "Home gym: adjustable dumbbells to 32 kg, resistance bands anchored at several '+
        'wall heights." Not "he said he has some bands."'}},
    required:['fact'], additionalProperties:false
  },
  strict:true
}];
async function aiRemember(fact){
  const all=await aiFacts();
  const t=String(fact||'').trim();
  if(!t) return 'Nothing to save.';
  if(all.some(f=>f.fact.toLowerCase()===t.toLowerCase())) return 'Already known — not saved twice.';
  all.push({fact:t, date:todayStr()});
  await kvSet('aiFacts',all.slice(-120));
  return 'Saved. This is now in front of you at the start of every conversation.';
}

/* his brief for the coach — set once, applies to every conversation */
const aiBrief=()=>kvGet('aiBrief').then(v=>(v&&v.trim())?v:AI_BRIEF);
const aiSessions=()=>kvGet('aiSessions').then(v=>Array.isArray(v)?v:[]);
const aiSaveSessions=v=>kvSet('aiSessions',v.slice(-AI_MAXSESS));

/* everything the coach is allowed to see, as plain text */
function coachData(){
  const m=reportModel();
  const L=[reportText(m)];
  const meds=S.entries.filter(e=>e.type==='meditation')
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(meds.length){
    L.push('');L.push('5. MEDITATION (not part of the shoulder programme)');
    L.push(['Date','Points','Within 5 min of waking','Outside','Length'].join('\t'));
    for(const e of meds) L.push([e.date,(e.points||medPoints(e)),e.afterWake?'yes':'no',
      e.outside?'yes':'no',e.timed?(e.minutes||MED_MIN)+' min':'logged by hand'].join('\t'));
  }
  if(S.plan&&S.plan.some(Boolean)){
    L.push('');L.push('6. THE WEEKLY PLAN HE SET HIMSELF');
    L.push(S.plan.map((v,i)=>DAYS[i]+': '+(v?'Session '+v:'rest')).join('\n'));
  }
  return L.join('\n');
}

/* Who the coach is. His setting, editable, and it leads the prompt every time. */
const AI_BRIEF=`You are André's fitness coach, and you have two kinds of expertise. He needs both at once.

The first is clinical. You know shoulders — the rotator cuff, impingement, scapular control, how a shoulder is rehabilitated and how it gets re-injured. You have seen a great many of them. You know what can be loaded at which stage, what a stalled rehab looks like from the outside, and when something has stopped being a training question and become a clinical one.

The second is coaching. You know how to build strength and muscle, in a gym or at home with whatever is to hand. You program rather than suggest: sets, loads, progressions, what to do this week.

His goal is both of those at once. He wants the shoulder fixed, and he wants to come out of it stronger and carrying more muscle than he went in. Do not treat those as in tension, and do not let the rehab shrink into a set of cautious little exercises done forever. Work out what can be loaded hard right now, and load it.

Motivate him the way a good coach does — by taking him seriously, by showing him what he has actually moved, and by telling him straight when a week was poor. Not by praising him. He will stop believing you if you are impressed by everything.`;

/* How to do the job well. Not a setting - this is craft, not preference. */
const AI_CRAFT=`He wants two questions answered whenever he opens this, and he wants you to commit rather than hedge:
1. How he is tracking.
2. What he should focus on next.

How to be useful:
- Quote his actual figures — the exercise, the load, the dates, the reps. "Lateral Raise 90/90 has sat at 5 kg since 14 July while the reps went 15 to 20" beats "you're progressing steadily". He can check a number against his own charts; he cannot check a generality.
- Say what you would do. He has asked for your opinion, not a menu of options. "Take it to 7.5 kg and drop back to 3 x 12" is the answer he wants. Reasoning in a line, not a paragraph.
- Read the notes as carefully as the numbers. "Felt tight", "shoulder pain", a gap in the log — that is where the signal is, and it is the only place his own experience is written down.
- Be willing to say nothing has changed, or that a week was poor, or that you cannot tell from this data. An observation he already knows is worth less than an honest "I don't see anything new this week".
- Never invent a figure. If the data does not support a conclusion, say so rather than reaching for one.
- He will ask you about training this app does not track — gym work, training at home, building muscle, what to eat, how to sleep. Answer it properly, from what you know. Just be clear which part is his data and which part is your experience, and ask for what you are missing rather than assuming it.

Where the line is: for all the shoulder expertise above, you are not his physiotherapist, and you are not examining him. You can read loads, reps, dates and his notes. You cannot see his shoulder, feel how it moves, or know what his physio has found beyond what he has written below. Give him your opinion on loads, volume, consistency and patterns — that is the job. When something looks like pain, a regression, or a call that belongs to a clinician, say so plainly and tell him to put it to his physio; then still give him your read, because he asked for it.

Length: answer the question and stop. This is a conversation on a phone, not a report. A couple of sentences is often the whole answer; three short paragraphs is a long one. Do not restate his question back to him, do not open with a preamble, do not close with a summary of what you just said, and do not add a section he did not ask for. If there is more worth saying, say so in a few words and let him ask — that is what the back-and-forth is for. Being asked to expand is a good outcome; being skimmed is not.

Style: talk to him, not about him. Plain sentences. No bullet-point avalanche, no bold heading on every line, no management-speak. If he pushes back or asks what you meant, answer that question and only that question.

You may use a line starting with "## " as a short heading where it genuinely helps, and **bold** sparingly. Nothing else — no tables, no code blocks, no nested lists.`;

/* what earlier readings concluded - continuity without dragging whole transcripts back in */
function priorNote(sessions){
  const past=sessions.filter(s=>s.gist).slice(-4);
  if(!past.length) return '';
  return '\n\nWHAT YOU TOLD HIM BEFORE\n'+
    past.map(s=>'- '+s.date+': '+s.gist).join('\n')+
    '\nHe has trained since then. Say whether he acted on it and what came of it, briefly, before moving on.';
}

function coachSystem(about,sessions,brief,facts){
  const bg=about.trim()
    ? '\n\nWHAT HE HAS TOLD YOU ABOUT HIMSELF AND THE INJURY\n'+about.trim()
    : '\n\nHe has not written anything about the injury itself yet, so work from the data alone and say what you would want to know.';
  const known=(facts&&facts.length)
    ? '\n\nWHAT HE HAS TOLD YOU IN PAST CONVERSATIONS\n'+
      facts.map(f=>'- '+f.fact).join('\n')+
      '\nHe told you these once and should never have to again. Use them without being asked and without repeating them back to him.'
    : '';
  return [
    {type:'text', text:brief.trim()+'\n\n'+AI_CRAFT},
    /* stable prefix above, his data below, cached so follow-ups re-read it for a tenth of the price */
    {type:'text', text:'TODAY IS '+todayStr()+bg+known+priorNote(sessions)+
      '\n\nHIS COMPLETE TRAINING RECORD\n'+coachData(),
     cache_control:{type:'ephemeral'}}
  ];
}

/* ---- the call. Streamed, because a chat that freezes for twenty seconds reads as broken ---- */
async function aiStream(key,system,messages,onText,onThink,signal){
  const res=await fetch(AI_URL,{
    method:'POST', signal,
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      /* the key lives on this phone only; Anthropic requires this to be explicit */
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:AI_MODEL, max_tokens:8000, stream:true,
      thinking:{type:'adaptive', display:'summarized'},
      /* medium effort: less preamble and a faster first word, which is what a
         chat wants — he can always push for more depth in the next message */
      output_config:{effort:'medium'},
      tools:AI_TOOLS, system, messages
    })
  });
  if(!res.ok){
    let detail='';
    try{ const j=await res.json(); detail=(j.error&&j.error.message)||''; }catch(e){}
    throw new AiError(res.status,detail);
  }
  const reader=res.body.getReader(), dec=new TextDecoder();
  let buf='', usage=null, text='', stop=null;
  const blocks=[];            /* the assistant turn, rebuilt as it arrives */
  let json='';                /* a tool call's arguments stream in as fragments */
  for(;;){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n\n'))>=0){
      const chunk=buf.slice(0,i); buf=buf.slice(i+2);
      const line=chunk.split('\n').find(l=>l.startsWith('data:'));
      if(!line) continue;
      let ev; try{ ev=JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(ev.type==='content_block_start'){
        const b=ev.content_block;
        if(b.type==='text') blocks[ev.index]={type:'text',text:''};
        else if(b.type==='tool_use'){ blocks[ev.index]={type:'tool_use',id:b.id,name:b.name,input:{}}; json=''; }
      } else if(ev.type==='content_block_delta'){
        const d=ev.delta;
        if(d.type==='text_delta'){ text+=d.text;
          if(blocks[ev.index]) blocks[ev.index].text+=d.text; onText(d.text); }
        else if(d.type==='thinking_delta'&&onThink) onThink(d.thinking||'');
        else if(d.type==='input_json_delta') json+=d.partial_json||'';
      } else if(ev.type==='content_block_stop'){
        const b=blocks[ev.index];
        if(b&&b.type==='tool_use'){ try{ b.input=JSON.parse(json||'{}'); }catch(e){ b.input={}; } json=''; }
      } else if(ev.type==='message_start'&&ev.message&&ev.message.usage){ usage=ev.message.usage; }
      else if(ev.type==='message_delta'){
        if(ev.usage) usage=Object.assign(usage||{},ev.usage);
        if(ev.delta&&ev.delta.stop_reason) stop=ev.delta.stop_reason;
      }
      else if(ev.type==='error'){ throw new AiError(0,(ev.error&&ev.error.message)||'stream error'); }
    }
  }
  return {text,usage,stop,blocks:blocks.filter(Boolean)};
}
class AiError extends Error{
  constructor(status,detail){ super(detail||('HTTP '+status)); this.status=status; this.detail=detail; }
  friendly(){
    if(this.status===401) return 'That API key was rejected. Check it in Settings below.';
    if(this.status===400&&/credit|balance/i.test(this.detail)) return 'Your Anthropic account is out of credit.';
    if(this.status===429) return 'Rate limited — wait a moment and ask again.';
    if(this.status>=500) return 'Anthropic’s API is having trouble. Try again in a minute.';
    return this.detail||'Something went wrong talking to the API.';
  }
}
/* Opus 5: $5 per million in, $25 out, cache reads a tenth of the input price */
function aiCost(u){
  if(!u) return null;
  const inp=(u.input_tokens||0)*5 + (u.cache_creation_input_tokens||0)*6.25 +
            (u.cache_read_input_tokens||0)*0.5;
  return (inp+(u.output_tokens||0)*25)/1e6;
}
const fmtCost=c=>c==null?'':(c<0.01?'under 1c':Math.round(c*100)+'c');

/* the model may use "## " headings and **bold**; nothing else is allowed through */
function aiHtml(t){
  return esc(t)
    .replace(/^## (.+)$/gm,'<span class="h">$1</span>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
}

  M.innerHTML=`<div id="chatwrap"></div>
    ${past?'<button class="btn secondary" id="bNew" style="margin-top:14px">Start a new reading</button>':`

    <div class="askbar">

    </div>
    <p class="costline" id="costLine"></p>`}
    <div class="btnrow" style="margin-top:14px">
      <button class="btn secondary small" id="bLog">Past readings${sessions.length?' · '+sessions.length:''}</button>

    const d=document.createElement('div'); d.className='saved';

    if(!el) return;

    const top=el.getBoundingClientRect().top+window.scrollY-((bar?bar.offsetHeight:0)+10);

  async function ask(text){
    if(busy||!text.trim()) return;

    msgs.push({role:'user',content:text});
    const mine=bubble('me',text);
    ta.value=''; grow();
    anchor(mine);                       /* his question to the top; the answer grows below it */

    abort=new AbortController();
    try{
      let said='';
      /* the coach may stop to write something to his profile; let it, then carry on.
         Bounded, so a misbehaving loop cannot spend his money in circles. */
      for(let round=0;round<4;round++){
        const think=document.createElement('div'); think.className='think';
        think.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
        wrap.appendChild(think);
        const out=bubble('ai',''); out.style.display='none';
        let acc='', thought='';
        const r=await aiStream(key,coachSystem(about,sessions,brief,facts),
          msgs.map(m=>({role:m.role,content:m.content})),
          t=>{ acc+=t;
               if(out.style.display==='none'){ think.remove(); out.style.display='';
                 /* his question is already at the top and the answer starts just
                    below it, so normally nothing needs to move. Only if the answer
                    would begin off-screen — a long question, a long tool exchange —
                    does it get pulled up. Once, never again while it writes. */
                 const t=out.getBoundingClientRect().top;

          t=>{ thought+=t; think.textContent=thought.slice(-220); },
          abort.signal);
        think.remove();
        const c=aiCost(r.usage); if(c) spent+=c; showCost();
        if(r.text.trim()){ out.innerHTML=aiHtml(r.text); said+=(said?'\n\n':'')+r.text; }
        else out.remove();
        const calls=r.blocks.filter(b=>b.type==='tool_use');
        if(!calls.length||r.stop!=='tool_use'){
          if(r.blocks.length) msgs.push({role:'assistant',content:r.blocks});
          break;
        }
        msgs.push({role:'assistant',content:r.blocks});

            res=await aiRemember(call.input.fact);

        }
        msgs.push({role:'user',content:results});
      }
      if(!said.trim()) bubble('err','The coach returned nothing. Try asking again.');
      await remember(said);
    }catch(e){
      wrap.querySelectorAll('.think').forEach(n=>n.remove());
      /* an unanswered question is not history: unwind back to before he asked */
      msgs.length=mark;
      while(wrap.lastElementChild&&!wrap.lastElementChild.classList.contains('me')) wrap.lastElementChild.remove();
      if(wrap.lastElementChild&&wrap.lastElementChild.classList.contains('me')) wrap.lastElementChild.remove();
      ta.value=text; grow();
      bubble('err',e instanceof AiError?e.friendly():

     taken from the opening read, not from whatever the last follow-up happened to say */
  let gist='';

    if(!gist) gist=(full.split('\n').find(l=>l.trim()&&!l.startsWith('#'))||'')
      .replace(/\*\*/g,'').trim().slice(0,220);

  sendB.onclick=()=>ask(ta.value);
  ta.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(ta.value); } };

  /* Reopening starts a fresh conversation, so it opens by asking what he wants
     rather than dropping him into a stale thread or firing a report at him. The
     greeting is worked out here, not by the model, so it costs nothing and is
     instant — he may only have come to ask one thing. */
  const last=sessions.length?sessions[sessions.length-1].date:null;
  const since=last?S.entries.filter(e=>e.date>last&&e.type==='workout').length:0;
  const hi=!last ? 'Ready when you are — I’ve read everything in the app.'
    : since ? 'Welcome back. '+since+' session'+(since===1?'':'s')+' since we last spoke on '+fmtDate(last)+'.'
            : 'Welcome back. Nothing new logged since '+fmtDate(last)+'.';
  const open=bubble('ai',hi+'\n\nWhat do you want to look at?');
  const chips=document.createElement('div');
  chips.className='chips'; chips.id='askChips';
  [['How am I tracking?','Give me your read: how am I tracking?'],
   ['What should I focus on?','What should I focus on next? Be specific.'],
   ['Write me a home session','Write me a session I can do at home this week.'],
   ['Something else','']].forEach(([label,q])=>{
    const b=document.createElement('button'); b.className='chip-ask'; b.textContent=label;
    b.onclick=()=>{ if(q) ask(q); else { chips.remove(); ta.focus(); } };
    chips.appendChild(b);
  });
  wrap.appendChild(chips);
  /* the greeting stays on screen only — a conversation whose first message is an
     assistant turn is rejected by the API, and it says nothing worth sending */
}

function niceAxisR(vals,intervals){
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){ const step=Math.max(1,Math.round(Math.abs(mn)*0.08))||1, v=mn;
    return {lo:v-2*step,hi:v+step,ticks:Array.from({length:intervals+1},(_,i)=>Math.round((v-2*step+i*step)*100)/100)}; }
  { const sp=mx-mn; mn-=sp*0.2; mx+=sp*0.2; }
  if(mn<0&&Math.min(...vals)>=0) mn=0;
  for(const step of [0.25,0.5,1,2,2.5,5,10,20,25,50,100]){
    const lo=Math.floor(mn/step)*step, hi=lo+step*intervals;
    if(hi>=mx) return {lo,hi,ticks:Array.from({length:intervals+1},(_,i)=>Math.round((lo+i*step)*100)/100)};
  }
  return {lo:mn,hi:mx,ticks:[mn,mx]};
}
function svgChart(pts,unit){
  const W=700,H=200,padL=40,padR=40,padT=12,padB=24,INT=3,n=pts.length;
  const dual=pts.some(p=>p.reps!=null);
  const A=niceAxisR(pts.map(p=>p.value),INT);
  const B=dual?niceAxisR(pts.filter(p=>p.reps!=null).map(p=>p.reps),INT):null;
  const X=i=> n===1?(padL+(W-padL-padR)/2):padL+(W-padL-padR)*(i/(n-1));
  const yOf=(v,ax)=>padT+(H-padT-padB)*(1-(v-ax.lo)/(ax.hi-ax.lo));
  let g='';
  A.ticks.forEach((tv,i)=>{
    const y=yOf(tv,A).toFixed(1);
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#dde4e2" stroke-width="1"/>`;
    g+=`<text x="${padL-6}" y="${(+y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#2a78d6" font-family="ui-monospace,Menlo,monospace">${tv}</text>`;
    if(dual) g+=`<text x="${W-padR+6}" y="${(+y+4).toFixed(1)}" text-anchor="start" font-size="11" fill="#eb6834" font-family="ui-monospace,Menlo,monospace">${B.ticks[i]}</text>`;
  });
  g+=`<line x1="${padL}" x2="${W-padR}" y1="${H-padB}" y2="${H-padB}" stroke="#c3cfcc" stroke-width="1"/>`;
  g+=`<text x="${padL}" y="${H-7}" font-size="11" fill="#71827e" font-family="ui-monospace,Menlo,monospace">${esc(fmtDate(pts[0].date))}</text>`;
  if(n>1) g+=`<text x="${W-padR}" y="${H-7}" text-anchor="end" font-size="11" fill="#71827e" font-family="ui-monospace,Menlo,monospace">${esc(fmtDate(pts[n-1].date))}</text>`;
  if(dual&&n>1){
    const rp=pts.map((p,i)=>({i,v:p.reps})).filter(o=>o.v!=null);
    if(rp.length>1) g+=`<path d="${rp.map((o,k)=>(k?'L':'M')+X(o.i).toFixed(1)+' '+yOf(o.v,B).toFixed(1)).join(' ')}" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 4"/>`;
    rp.forEach(o=>{ g+=`<circle cx="${X(o.i).toFixed(1)}" cy="${yOf(o.v,B).toFixed(1)}" r="3.5" fill="#fff" stroke="#eb6834" stroke-width="1.5"/>`; });
  }
  if(n>1) g+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+yOf(p.value,A).toFixed(1)).join(' ')}" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{ g+=`<circle cx="${X(i).toFixed(1)}" cy="${yOf(p.value,A).toFixed(1)}" r="3.5" fill="#2a78d6"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="progress chart" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
function reportModel(){
  const all=[...S.entries].filter(e=>e.type!=='meditation')
    .sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  const workouts=all.filter(e=>e.type==='workout');
  const others=all.filter(e=>e.type!=='workout');
  const from=all.length?all[0].date:todayStr(), to=all.length?all[all.length-1].date:todayStr();
  const days=Math.max(1,Math.round((new Date(to)-new Date(from))/86400000)+1);
  const perWeek=(workouts.length/(days/7));
  const prog=new Map(); const rows=[];
  for(const e of workouts){
    const sl=(e.sessions&&e.sessions.length?e.sessions:[e.session]).join('+');
    for(const x of e.exercises){
      if(x.skipped) continue;
      const snap={date:e.date, load:fmtLoad(x.load,x.level), vol:fmtVol(x)};
      const rec=prog.get(x.name)||{name:x.name,count:0,first:snap,latest:snap};
      rec.count++; rec.latest=snap; prog.set(x.name,rec);
      rows.push([e.date, sl, x.name, fmtLoad(x.load,x.level), x.sets, x.reps+(x.mode==='secs'?' s':'')]);
    }
  }
  const raised=[...prog.values()].filter(r=>{
    const a=parseFloat(r.first.load), b=parseFloat(r.latest.load);
    return !isNaN(a)&&!isNaN(b)&&b>a; }).length;
  const painDays=others.filter(e=>e.type==='injury').length;
  return {all,workouts,others,from,to,perWeek,prog:[...prog.values()],rows,raised,painDays,
    series:progressSeries()};
}

  if(e.type==='injury') return 'Pain';
  if(e.type==='swim') return 'Swim';
  if(e.type==='bike') return 'Bike';
  if(e.type==='run') return 'Run';
  return e.type;
};
const entryContent=e=>{
  if(e.type==='workout'){ const n=e.exercises.filter(x=>!x.skipped).length;
    return n+' exercise'+(n===1?'':'s'); }
  if(e.type==='swim') return e.laps+' laps · '+(e.style||'');
  if(e.type==='bike') return e.km+' km';

};

  const chartable=[...m.series.entries()].filter(([n,pts])=>pts.length>1);
  if(chartable.length){
    P.push(`<section><div class="shead"><span class="snum">04</span><h2>Progress charts</h2>
      <span class="hint">${chartable.length} exercises</span></div>
      <div class="legend"><span><i></i>Weight · left axis</span><span><i class="dash"></i>Reps · right axis</span></div>`);
    for(const [name,pts] of chartable){
      const unit=pts.unit||(pts[0].kind==='bandKg'?'kg band':'kg');
      const f=pts[0].value, l=pts[pts.length-1].value, d=Math.round((l-f)*100)/100;
      P.push(`<div class="chart"><h3>${esc(name)}</h3>
        <p class="csub">${f} → ${l} ${esc(unit)} (${d>0?'+':''}${d}) · ${pts.length} sessions</p>
        ${svgChart(pts,unit)}</div>`);
    }
    P.push(`</section>`);
  }
  // 05 full data
  P.push(`<section><div class="shead"><span class="snum">05</span><h2>Full data</h2>
    <span class="hint">${m.rows.length} rows</span></div>
    <p class="apxnote">Every recorded exercise, one row per exercise per session.</p>
    <table><thead><tr><th>Date</th><th>Session</th><th>Exercise</th>
    <th class="num">Load</th><th class="num">Sets</th><th class="num">Reps</th></tr></thead><tbody>`);
  let prev=null;
  for(const r of m.rows){
    const cls=(prev&&prev!==r[0])?' class="grpstart"':''; prev=r[0];
    P.push(`<tr${cls}><td class="num">${esc(r[0])}</td><td class="num">${esc(r[1])}</td><td>${esc(r[2])}</td>
      <td class="num">${esc(r[3])}</td><td class="num">${r[4]}</td><td class="num">${esc(String(r[5]))}</td></tr>`);
  }
  P.push(`</tbody></table>`);
  if(m.others.length){
    P.push(`<h3 style="margin:24px 0 9px">Appointments, symptoms and other activity</h3>
      <table><thead><tr><th style="width:20%">Date</th><th style="width:16%">Type</th><th>Detail</th></tr></thead><tbody>`);
    for(const e of m.others) P.push(`<tr><td class="num">${esc(e.date)}</td><td>${esc(entryLabel(e))}</td>
      <td>${esc(entryContent(e)+(e.comments?' · '+e.comments.replace(/\n/g,' · '):''))}</td></tr>`);
    P.push(`</tbody></table>`);
  }
  P.push(`</section>`);
  P.push(`<footer>
    <p><b>How this was recorded.</b> Every figure is the load and repetition count entered in the Shoulder Trainer app at the time of the session — not recalled afterwards.</p>
    <p><b>Reading the charts.</b> Weight and reps use separate scales, so the two lines crossing carries no meaning; read each line's own trend.</p>
    </footer></div></body></html>`);
  return P.join('');
}
function reportText(m){
  const L=[], tab=a=>a.join('\t');
  L.push('SHOULDER REHABILITATION PROGRESS REPORT');
  L.push('Period: '+fmtFull(m.from)+' - '+fmtFull(m.to)+'   Generated: '+fmtFull(todayStr()));
  L.push(m.workouts.length+' sessions ('+m.perWeek.toFixed(1)+'/week) · '+m.raised+' loads increased · '+m.painDays+' day(s) off with pain');
  L.push('');
  L.push('1. CURRENT PROGRAMME');
  for(const k of ['A','B','C']){
    const t=S.templates[k]; if(!t) continue;
    L.push('');L.push(t.name);
    L.push(tab(['Exercise','Load','Sets','Reps']));
    for(const x of t.exercises) L.push(tab([x.name,fmtLoad(x.load,tmplLevel(x)),x.sets,x.reps+(x.mode==='secs'?' s':'')]));
  }
  L.push('');L.push('2. SESSION LOG');
  L.push(tab(['Date','Type','Content','Notes']));
  for(const e of m.all) L.push(tab([e.date,entryLabel(e),entryContent(e),(e.note||e.comments||'').replace(/\n/g,' · ')]));
  L.push('');L.push('3. LOAD PROGRESSION');
  L.push(tab(['Exercise','First load','First sets x reps','Latest load','Latest sets x reps','Sessions']));
  for(const r of m.prog) L.push(tab([r.name,r.first.load,r.first.vol,r.latest.load,r.latest.vol,r.count]));
  L.push('');L.push('4. FULL DATA');
  L.push(tab(['Date','Session','Exercise','Load','Sets','Reps']));
  for(const r of m.rows) L.push(tab(r));
  L.push('');
  L.push('Charts and the formatted layout are in the PDF version, sent separately from the app.');
  return L.join('\n');
}
const fmtFull=iso=>{ const [y,mo,d]=iso.split('-').map(Number);
  return new Date(y,mo-1,d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); };

/* Mail clients drop <style> blocks, so the pasteable version inlines every rule */
function reportEmailHTML(m){
  const F='font-family:-apple-system,Helvetica,Arial,sans-serif';
  const H2=`${F};font-size:16px;font-weight:700;margin:22px 0 8px;color:#12181a`;
  const TB=`border-collapse:collapse;width:100%;${F};font-size:13px;margin-bottom:6px`;
  const TH='text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#71827e;'+
    'border-bottom:1px solid #c3cfcc;padding:5px 10px 5px 0';
  const TD='padding:5px 10px 5px 0;border-bottom:1px solid #e4e9e8;vertical-align:top';
  const NUM=TD+';white-space:nowrap;font-variant-numeric:tabular-nums';
  const P=[];
  const table=(heads,rows,numFrom)=>{
    P.push(`<table style="${TB}"><thead><tr>`);
    heads.forEach(h=>P.push(`<th style="${TH}">${esc(h)}</th>`));
    P.push('</tr></thead><tbody>');
    rows.forEach(r=>{
      P.push('<tr>');
      r.forEach((c,i)=>P.push(`<td style="${i>=numFrom?NUM:TD}">${esc(String(c==null?'':c))}</td>`));
      P.push('</tr>');
    });
    P.push('</tbody></table>');
  };
  P.push(`<div style="${F};font-size:14px;color:#12181a;line-height:1.5">`);
  P.push(`<div style="${F};font-size:19px;font-weight:700">Shoulder rehabilitation — progress report</div>`);
  P.push(`<div style="color:#43524f;font-size:13px;margin-top:4px">${esc(fmtFull(m.from))} – ${esc(fmtFull(m.to))}
    · ${m.workouts.length} sessions (${m.perWeek.toFixed(1)}/week) · ${m.raised} loads increased
    · ${m.painDays} day${m.painDays===1?'':'s'} off with pain</div>`);

  P.push(`<div style="${H2}">1 · Current programme</div>`);
  for(const k of ['A','B','C']){
    const t=S.templates[k]; if(!t) continue;
    P.push(`<div style="${F};font-size:13px;font-weight:700;margin:12px 0 4px">${esc(t.name)}</div>`);
    table(['Exercise','Load','Sets × reps','Cue'],
      t.exercises.map(x=>[x.name,fmtLoad(x.load,tmplLevel(x)),fmtVol(x),x.cue||'']),1);
  }
  P.push(`<div style="${H2}">2 · Session log</div>`);
  table(['Date','Type','Content','Notes'],
    m.all.map(e=>[e.date,entryLabel(e),entryContent(e),(e.note||e.comments||'').replace(/\n/g,' · ')]),0);

  P.push(`<div style="${H2}">3 · Load progression</div>`);
  table(['Exercise','First load','First sets × reps','Latest load','Latest sets × reps','Sessions'],
    m.prog.map(r=>[r.name,r.first.load,r.first.vol,r.latest.load,r.latest.vol,r.count]),1);

  P.push(`<div style="${H2}">4 · Full data · ${m.rows.length} rows</div>`);
  table(['Date','Session','Exercise','Load','Sets','Reps'],m.rows,3);

  P.push(`<div style="color:#71827e;font-size:12px;margin-top:18px">Every figure was entered in the
    Shoulder Trainer app at the time of the session. Progress charts are in the PDF version.</div>`);
  P.push('</div>');
  return P.join('');
}
/* copy formatted + plain versions together so Mail pastes tables and Excel pastes columns */
function copyRich(html,text){
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob([text],{type:'text/plain'})
      })]).catch(()=>copySync(text));
      return true;
    }
  }catch(e){}
  return copySync(text);
}
function copySync(text){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,text.length);
    const ok=document.execCommand('copy');
    ta.remove();
    if(!ok&&navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
    return true;
  }catch(e){
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); return true; }
    return false;
  }
}
const MAILTO_SAFE=1400;   /* iOS truncates long mailto bodies */
function openMail(url){ location.href=url; }
function viewReport(M){
  setTab('settings'); setBar('Report for physio','settings');
  const m=reportModel();
  if(!m.all.length){ M.innerHTML='<p class="empty">Nothing logged yet — the report needs at least one session.</p>'; return; }
  const html=reportHTML(m);
  let addr=null;                     /* cached so sending stays inside the tap */
  kvGet('physioEmail').then(v=>{ addr=v||null; const el=$('#addrLine'); if(el&&addr) el.textContent='Sends to '+addr; });
  M.innerHTML=`
    <div class="card"><div class="cardsub" style="color:var(--ink)">
      <b>${m.workouts.length} sessions</b> · ${esc(fmtFull(m.from))} – ${esc(fmtFull(m.to))}<br>
      Programme, session log, load progression, charts and ${m.rows.length} rows of full data.</div></div>
    <iframe id="rprev" title="Report preview" style="width:100%;height:50vh;border:0;border-radius:12px;
      box-shadow:inset 0 0 0 1px var(--ring);background:#fff"></iframe>
    <button class="btn" id="bMail" style="margin-top:14px">Email report</button>
    <div class="btnrow">
      <button class="btn secondary" id="bPrint">Save as PDF</button>
      <button class="btn secondary" id="bAddr">Change address</button>
    </div>
    <p class="cue" id="addrLine" style="margin:2px 2px 2px">No address saved yet</p>
    <p class="cue" style="margin:8px 2px 24px"><b>Email report</b> copies the report as formatted tables
      and opens Mail — long-press in the message and Paste. The tables keep their layout in Mail and still
      paste into Excel as columns. <b>Save as PDF</b> opens the print sheet for the full version with charts.</p>`;
  $('#rprev').srcdoc=html;
  const subject='Shoulder rehab progress report — '+fmtFull(m.from)+' to '+fmtFull(m.to);
  const promptAddr=()=>{
    const a=(prompt('Send the report to which email address?', addr||'')||'').trim();
    if(!a) return null;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a)){ alert('That doesn’t look like an email address.'); return null; }
    addr=a; kvSet('physioEmail',a); const el=$('#addrLine'); if(el) el.textContent='Sends to '+a;
    return a;
  };
  $('#bMail').onclick=()=>{
    if(!addr){ if(!promptAddr()) return; toast('Address saved — tap Email report to send'); return; }
    /* formatted tables on the clipboard, plain text as the fallback flavour */
    copyRich(reportEmailHTML(m),reportText(m));
    toast('Report copied — paste it into the email');
    const head='mailto:'+encodeURIComponent(addr)+'?subject='+encodeURIComponent(subject);
    setTimeout(()=>{ openMail(head+'&body='+
      encodeURIComponent('Hi,\n\nMy shoulder rehab progress report is below.\n\n')); },900);
  };
  $('#bPrint').onclick=()=>{
    const f=$('#rprev');
    try{ f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){
      const w=window.open('','_blank');
      if(w){ w.document.write(html); w.document.close(); setTimeout(()=>w.print(),400); }
      else alert('Could not open the print view.');
    }
  };
  $('#bAddr').onclick=()=>{ if(promptAddr()) toast('Saved '+addr); };
}

/* ============ export / import ============ */
async function exportData(){
  /* the background note is his writing and worth keeping; the API key is a live
     credential and must never travel in a file that gets emailed around */
  const about=(await kvGet('aiAbout'))||'';
  const facts=await aiFacts();
  const payload={app:'shoulder-trainer', version:1, exportedAt:new Date().toISOString(),
    templates:S.templates, entries:S.entries, about, facts};
  const json=JSON.stringify(payload,null,1);
  const name='shoulder-trainer-backup-'+todayStr()+'.json';
  const file=new File([json],name,{type:'application/json'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:'Shoulder Trainer backup'}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
async function importData(ev){
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  let data;
  try{ data=JSON.parse(await f.text()); }catch(e){ alert('That file is not a valid backup.'); return; }
  if(!data||data.app!=='shoulder-trainer'||!data.templates||!Array.isArray(data.entries)){ alert('That file is not a Shoulder Trainer backup.'); return; }
  if(!confirm('Import backup from '+(data.exportedAt||'unknown date').slice(0,10)+'?\nThis REPLACES your exercises and all '+S.entries.length+' current entries with the '+data.entries.length+' entries in the backup.')) return;
  await kvSet('templates',data.templates);
  if(typeof data.about==='string') await kvSet('aiAbout',data.about);
  if(Array.isArray(data.facts)) await kvSet('aiFacts',data.facts);
  await tx('entries','readwrite',s=>{ s.clear(); for(const e of data.entries) s.put(e); });
  await loadState(); toast('Backup imported'); nav('home'); render();
}

(async function(){
  try{

    $('#main').innerHTML='<p class="empty">Could not open local storage: '+esc(err.message)+'</p>';

  }
  render();
  /* last chance to write the draft when iOS suspends or reclaims the app */
  const flush=()=>{ if(draftFlush) draftFlush(); };
  window.addEventListener('pagehide',flush);
  window.addEventListener('beforeunload',flush);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flush(); });
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
