<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shoulder Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shoulder">
<meta name="theme-color" content="#f5f5f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme: light;   /* always light — the app is a light document */
  --page:#f5f5f3; --surface:#ffffff; --ink:#1c1c1a; --ink-2:#52514e; --muted:#8a887f;
  --grid:#e7e6e0; --baseline:#c3c2b7; --ring:rgba(28,28,26,.09);
  --accent:#2a78d6; --chart:#2a78d6; --chart2:#eb6834; --danger:#b3372f;
  --tint-a-bg:#e8f0fb; --tint-a-ink:#1c5cab;
  --tint-b-bg:#fcebe2; --tint-b-ink:#b4441c;
  --tint-c-bg:#e2f4ec; --tint-c-ink:#0d7a52;
  --tint-p-bg:#eceafa; --tint-p-ink:#4a3aa7;
  --tint-i-bg:#fbe7e6; --tint-i-ink:#a53730;
  --done:#0ca30c; --done-bg:#eaf7ea;
  --tint-s-bg:#e2f4ec; --tint-s-ink:#0d7a52;
  --tint-r-bg:#fdf3da; --tint-r-ink:#8a6100;
  --tint-k-bg:#fbe9f0; --tint-k-ink:#a53a68;
  --tint-m-bg:#eceafa; --tint-m-ink:#4a3aa7;
  --tint-ai-bg:#e4f0f6; --tint-ai-ink:#14607f;
  --warn:#b98200; --warn-bg:#fdf3da;
  --shadow:0 1px 2px rgba(20,20,18,.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
header.appbar{
  position:sticky; top:0; z-index:20; background:var(--page);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; gap:10px; min-height:44px;
  border-bottom:1px solid var(--ring);
}
header.appbar h1{font-size:19px; margin:0; font-weight:700; flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.backbtn{border:0;background:none;color:var(--accent);font-size:16px;padding:6px 4px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:2px;font-family:inherit}
.backbtn svg{margin-left:-6px}
.cancelbtn{border:0;background:none;color:var(--accent);font-size:16px;font-weight:600;padding:6px 4px;cursor:pointer;font-family:inherit;flex:none}
.savebtn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:7px 18px;font-size:14.5px;font-weight:650;cursor:pointer;font-family:inherit;flex:none}
main{padding:16px; max-width:560px; margin:0 auto}
.hidden{display:none!important}

/* buttons */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  border:0; border-radius:12px; padding:14px 16px; font-size:16px; font-weight:600;
  cursor:pointer; color:#fff; background:var(--accent); font-family:inherit;
  letter-spacing:.01em;
}
.btn:active{filter:brightness(.92)}
.btn.secondary{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--ring), var(--shadow)}
.btn.danger{background:var(--tint-i-bg); color:var(--tint-i-ink)}
.btn.small{width:auto; padding:8px 14px; font-size:14px; border-radius:10px; font-weight:600}
.btnrow{display:flex; gap:10px; margin:12px 0}
.btnrow .btn{flex:1}
.chip{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:8px; flex:none}
.chip.physio{background:var(--tint-p-bg); color:var(--tint-p-ink)}
.chip.injury{background:var(--tint-i-bg); color:var(--tint-i-ink)}
.chip.swim{background:var(--tint-s-bg); color:var(--tint-s-ink)}
.chip.run{background:var(--tint-r-bg); color:var(--tint-r-ink)}
.chip.bike{background:var(--tint-k-bg); color:var(--tint-k-ink)}
.chip.med{background:var(--tint-m-bg); color:var(--tint-m-ink)}

/* cards */
.card{
  background:var(--surface); border-radius:12px; padding:14px;
  box-shadow:inset 0 0 0 1px var(--ring), var(--shadow); margin-bottom:10px;
}
.card.tappable{cursor:pointer}
.card.tappable:active{filter:brightness(.96)}
.cardhead{display:flex; align-items:center; gap:10px}
.cardhead .date{font-weight:650}
.cardhead .spacer{flex:1}
.cardsub{color:var(--ink-2); font-size:14px; margin-top:4px}
.chev{color:var(--muted); display:inline-flex; align-items:center}

/* badges */
.badge{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:30px; height:30px; border-radius:9px; font-weight:700; font-size:14px;
  padding:0 6px; flex:none; letter-spacing:.02em;
}
.badge svg{display:block}
.badge.A{background:var(--tint-a-bg); color:var(--tint-a-ink)}
.badge.B{background:var(--tint-b-bg); color:var(--tint-b-ink)}
.badge.C{background:var(--tint-c-bg); color:var(--tint-c-ink)}
.badge.physio{background:var(--tint-p-bg); color:var(--tint-p-ink)}
.badge.injury{background:var(--tint-i-bg); color:var(--tint-i-ink)}
.badge.swim{background:var(--tint-s-bg); color:var(--tint-s-ink)}
.badge.run{background:var(--tint-r-bg); color:var(--tint-r-ink)}
.badge.bike{background:var(--tint-k-bg); color:var(--tint-k-ink)}
.badge.med{background:var(--tint-m-bg); color:var(--tint-m-ink)}

.weekline{color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; margin:16px 2px 10px}
.sectionlabel{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:20px 2px 8px; display:flex; align-items:center; gap:7px}
.empty{color:var(--muted); text-align:center; padding:28px 10px; font-size:15px}

/* exercise rows in capture/edit */
.exrow{background:var(--surface); border-radius:12px; box-shadow:inset 0 0 0 1px var(--ring), var(--shadow); padding:12px 14px; margin-bottom:10px}
.exrow.skipped .exbody{opacity:.35}
.exrow .extitle{display:flex; align-items:center; gap:8px}
.exrow .exname{font-weight:650; flex:1}
.cue{color:var(--muted); font-size:13px; margin-top:2px}
.controls{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.ctl{flex:1; min-width:104px}
.ctl label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600}
.stepper{display:flex; align-items:stretch; border-radius:10px; box-shadow:inset 0 0 0 1px var(--ring); overflow:hidden; background:var(--page)}
.stepper button{border:0; background:none; color:var(--accent); font-size:18px; width:27px; cursor:pointer; font-weight:700; flex:none; padding:0}
.stepper input{border:0; background:none; color:var(--ink); flex:1; width:100%; min-width:44px; text-align:center; font-size:16px; font-weight:650; padding:9px 0; font-variant-numeric:tabular-nums; font-family:inherit}
.stepper input:focus{outline:none}
input[type=text],input[type=date],input[type=url],textarea,select{
  width:100%; border:0; border-radius:10px; box-shadow:inset 0 0 0 1px var(--ring);
  background:var(--surface); color:var(--ink); padding:12px; font-size:16px; font-family:inherit;
}
textarea{min-height:96px; resize:vertical}
.field{margin-bottom:14px}
.field>label{display:block; font-size:13px; color:var(--muted); font-weight:650; margin:0 2px 6px}

.donebtn{width:34px; height:34px; border-radius:999px; border:0; flex:none; cursor:pointer;
  background:var(--page); box-shadow:inset 0 0 0 1.5px var(--baseline); color:transparent;
  display:inline-flex; align-items:center; justify-content:center}
.donebtn.on{background:var(--done); color:#fff; box-shadow:none; animation:pop .3s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.exrow.done{background:var(--done-bg); box-shadow:inset 0 0 0 1.5px rgba(12,163,12,.4)}
.exrow.skipped .donebtn{opacity:.3; pointer-events:none}
.exrow.done .exbody{animation:doneflash .45s ease-out}
@keyframes doneflash{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}

/* set-by-set tick off */
.setbar{display:flex; align-items:center; gap:10px; margin-top:11px}
.setmarks{display:flex; align-items:center; gap:6px; flex:1; min-height:18px}
.setmark{width:15px; height:15px; border-radius:5px; display:block;
  box-shadow:inset 0 0 0 1.5px var(--baseline); background:transparent; transition:background .15s}
.setmark.on{background:var(--done); box-shadow:none}
.setmark.on.pop{animation:markpop .32s cubic-bezier(.3,1.7,.55,1)}
@keyframes markpop{0%{transform:scale(.4)}65%{transform:scale(1.35)}100%{transform:scale(1)}}
.setbtn{border:0; border-radius:999px; padding:9px 16px; font-size:14px; font-weight:650; flex:none;
  background:var(--done); color:#fff; cursor:pointer; font-family:inherit}
.setbtn:active{filter:brightness(.9); transform:scale(.97)}
.exrow.skipped .setbar{display:none}

/* completion celebration */
.extitle{position:relative}
.burst{position:absolute; left:17px; top:50%; width:0; height:0; pointer-events:none; z-index:5}
.burst i{position:absolute; left:0; top:0; width:7px; height:7px; border-radius:2px;
  animation:fly .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{
  0%{transform:translate(0,0) scale(.5) rotate(0deg); opacity:1}
  70%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(220deg); opacity:0}
}
#confetti{position:fixed; inset:0; z-index:60; pointer-events:none;
  transition:opacity .6s ease}
.medhail{font-size:22px; font-weight:700; color:var(--ink); margin-bottom:10px; line-height:1.25}
.card.meddone.perfect{box-shadow:inset 0 0 0 2px var(--tint-m-ink), 0 10px 30px rgba(74,58,167,.18);
  animation:hail .5s cubic-bezier(.2,.7,.3,1)}
@keyframes hail{0%{transform:scale(.94); opacity:.4}60%{transform:scale(1.02)}100%{transform:scale(1); opacity:1}}
@media (prefers-reduced-motion: reduce){
  #confetti{display:none}
  .card.meddone.perfect{animation:none}
  .burst{display:none}
  .setmark.on.pop,.exrow.done .exbody,.donebtn.on{animation:none}
}
.skipbtn{border:0; border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600;
  background:var(--page); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--ring); cursor:pointer; font-family:inherit}
.skipbtn.on{background:var(--tint-i-bg); color:var(--tint-i-ink); box-shadow:none}
.videobtn{border:0; border-radius:999px; width:32px; height:32px;
  display:inline-flex; align-items:center; justify-content:center; flex:none;
  background:var(--page); color:var(--accent); box-shadow:inset 0 0 0 1px var(--ring); cursor:pointer}

/* session pick */
.pickbtn{display:flex; align-items:center; gap:14px; width:100%; border:0; border-radius:14px;
  background:var(--surface); box-shadow:inset 0 0 0 1px var(--ring), var(--shadow); padding:16px; margin-bottom:12px;
  cursor:pointer; text-align:left; font-family:inherit; color:var(--ink)}
.pickbtn .badge{min-width:42px; height:42px; font-size:19px; border-radius:12px}
.pickbtn.planned{box-shadow:inset 0 0 0 2px var(--accent), var(--shadow)}
.pickbtn.activity{padding:14px 16px}
.pickbtn.activity .chip{width:42px; height:42px; border-radius:12px}
.pickdiv{display:flex; align-items:center; gap:12px; margin:22px 2px 12px}
.pickdiv::before,.pickdiv::after{content:''; flex:1; height:1px; background:var(--grid)}
.pickdiv span{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.pickmain{min-width:0}
.todaytag{display:inline-block; margin-left:8px; vertical-align:2px; font-size:10.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:#fff; background:var(--accent);
  border-radius:999px; padding:2px 8px}
.pickbtn .pickname{font-size:17px; font-weight:700}
.pickbtn .picksub{font-size:13px; color:var(--muted)}

/* detail table */
table.dtl{width:100%; border-collapse:collapse; font-size:15px}
table.dtl td{padding:8px 6px; border-top:1px solid var(--grid); vertical-align:top}
table.dtl tr:first-child td{border-top:0}
table.dtl td.num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.skiptag{color:var(--danger); font-weight:700; font-size:12px; letter-spacing:.04em}

/* tab bar */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  display:flex; background:var(--page); border-top:1px solid var(--ring);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
}
nav.tabs a{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0;
  text-decoration:none; color:var(--muted); font-size:10.5px; font-weight:600; padding:5px 0 3px;
  letter-spacing:.02em; white-space:nowrap}
nav.tabs a svg{display:block}
nav.tabs a.active{color:var(--accent)}

/* settings list */
.setrow{display:flex; align-items:center; gap:10px; padding:12px 2px; border-top:1px solid var(--grid)}
.setrow:first-child{border-top:0}
.setrow .setname{flex:1; min-width:0}
.setrow .setname .n{font-weight:650}
.setrow .setname .s{font-size:13px; color:var(--muted)}
.iconbtn{border:0; background:var(--page); box-shadow:inset 0 0 0 1px var(--ring); color:var(--ink-2);
  border-radius:9px; width:34px; height:34px; cursor:pointer; flex:none;
  display:inline-flex; align-items:center; justify-content:center}
.iconbtn:disabled{opacity:.3}

/* chart */
.viz-root{background:var(--surface); border-radius:14px; box-shadow:inset 0 0 0 1px var(--ring); padding:14px}
.viz-root h3{margin:0 0 2px; font-size:15px}
.viz-root .vsub{color:var(--muted); font-size:13px; margin-bottom:8px}
.vlegend{display:flex; gap:14px; margin:0 0 6px; font-size:12px; color:var(--ink-2); font-weight:600}
.vlegend span{display:inline-flex; align-items:center; gap:5px}
.vlegend i{width:9px; height:9px; border-radius:3px; display:block}
.viz-root svg{display:block; width:100%; height:auto; touch-action:pan-y}
.viz-tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--page);
  border-radius:8px; padding:5px 9px; font-size:12.5px; font-weight:650; white-space:nowrap;
  transform:translate(-50%,-130%); opacity:0; transition:opacity .1s}
details.datatable{margin-top:10px}
details.datatable summary{color:var(--accent); font-size:14px; font-weight:650; cursor:pointer}
details.datatable table{width:100%; font-size:14px; border-collapse:collapse; margin-top:6px}
details.datatable td,details.datatable th{padding:5px 6px; border-top:1px solid var(--grid); text-align:left}
.card.resume{box-shadow:inset 0 0 0 2px var(--accent), var(--shadow)}
/* the level picker takes a line of its own, above sets and reps */
.ctl.wide{flex:0 0 100%; min-width:100%}
.levelseg{display:flex; gap:6px}
.lvbtn{flex:1; height:38px; padding:0 10px; border:0; border-radius:9px; background:var(--page); color:var(--ink-2);
  font-family:inherit; font-size:14px; font-weight:650; white-space:nowrap;
  box-shadow:inset 0 0 0 1px var(--ring); cursor:pointer}
.lvbtn.on{background:var(--tint-c-bg); color:var(--tint-c-ink); box-shadow:none}
.medq{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--grid); font-weight:600}
.medq:first-child{border-top:0; padding-top:2px}
.medq span{flex:1}
.qtog{border:0; border-radius:999px; padding:7px 18px; font-family:inherit; font-size:14px; font-weight:700;
  background:var(--page); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--ring); cursor:pointer}
.qtog.on{background:var(--tint-m-bg); color:var(--tint-m-ink); box-shadow:none}
.medscore{border-top:1px solid var(--grid); padding-top:11px; margin-top:4px;
  font-size:13px; font-weight:600; color:var(--muted)}
.timerwrap{text-align:center; padding:26px 16px 20px}
.tclock{font-size:54px; font-weight:300; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1}
.tbar{height:5px; border-radius:999px; background:var(--grid); margin:20px 6px 14px; overflow:hidden}
.tbar i{display:block; height:100%; width:0; background:var(--tint-m-ink); transition:width .25s linear}
.card.meddone{text-align:center; padding:28px 16px; box-shadow:inset 0 0 0 2px var(--tint-m-ink), var(--shadow)}
.meddone .cardsub{display:block}
.medbig{font-size:34px; font-weight:700; color:var(--tint-m-ink); margin-bottom:6px}
.weekplan{background:var(--surface); border-radius:12px; padding:11px 10px 9px;
  box-shadow:inset 0 0 0 1px var(--ring), var(--shadow); margin-bottom:12px}
.wpdays{display:flex; gap:4px}
.wpday{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px}
.wpd{font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--muted)}
.wpday.today .wpd{color:var(--accent)}
.wpslot{width:28px; height:28px; min-width:28px; border-radius:8px; display:inline-flex;
  align-items:center; justify-content:center; font-weight:700; font-size:13px; padding:0}
.wpslot.none{color:var(--muted); box-shadow:inset 0 0 0 1px var(--ring)}
.wpday.today .wpslot{box-shadow:0 0 0 2px var(--accent)}
.wptoday{text-align:center; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-top:9px}
.daypick{display:flex; gap:5px; margin:0 2px 9px}
.dbtn{flex:1; height:30px; border:0; border-radius:8px; background:var(--surface); color:var(--muted);
  font-family:inherit; font-weight:700; font-size:11.5px; letter-spacing:.02em;
  box-shadow:inset 0 0 0 1px var(--ring); cursor:pointer}
.dbtn.on{box-shadow:none}
.dbtn.on.A{background:var(--tint-a-bg); color:var(--tint-a-ink)}
.dbtn.on.B{background:var(--tint-b-bg); color:var(--tint-b-ink)}
.dbtn.on.C{background:var(--tint-c-bg); color:var(--tint-c-ink)}
.cellv{border:0; background:none; font:inherit; color:var(--accent); font-weight:650; cursor:pointer;
  padding:3px 2px; min-width:34px; text-align:right; text-decoration:underline;
  text-decoration-style:dotted; text-underline-offset:3px; font-variant-numeric:tabular-nums}
.cellv:active{opacity:.6}
input.celledit{width:78px; padding:5px 8px; font:inherit; font-size:15px; font-weight:650;
  text-align:right; border:0; border-radius:8px; background:var(--page); color:var(--ink);
  box-shadow:inset 0 0 0 1.5px var(--accent); font-variant-numeric:tabular-nums}
input.celledit:focus{outline:none}
details.datatable td:last-child,details.datatable th:last-child{text-align:right; font-variant-numeric:tabular-nums}

/* ================= fitness coach ================= */
.chip.ai,.badge.ai{background:var(--tint-ai-bg); color:var(--tint-ai-ink)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 4px}
.chip-ask{border:0; border-radius:999px; padding:10px 15px; font-family:inherit; font-size:14px;
  font-weight:600; background:var(--surface); color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--ring), var(--shadow); cursor:pointer; text-align:left}
.chip-ask:active{opacity:.6}
.saved{align-self:flex-start; max-width:88%; display:flex; gap:7px; align-items:flex-start;
  font-size:12.5px; color:var(--tint-ai-ink); background:var(--tint-ai-bg);
  padding:8px 11px; border-radius:11px}
.saved svg{flex:none; margin-top:1px}
.factrow{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--grid); font-size:14px}
.factrow:first-child{border-top:0}
.factrow span{flex:1; line-height:1.4}
#chatwrap{display:flex; flex-direction:column; gap:12px; padding-bottom:6px}
.bub{max-width:88%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.5;
  white-space:pre-wrap; overflow-wrap:anywhere}
.bub.me{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px}
.bub.ai{align-self:flex-start; background:var(--surface); color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--ring), var(--shadow); border-bottom-left-radius:5px}
.bub.ai b{font-weight:700}
.bub.ai .h{display:block; font-weight:700; margin:13px 0 3px}
.bub.ai .h:first-child{margin-top:0}
.bub.err{align-self:stretch; max-width:100%; background:var(--tint-i-bg); color:var(--tint-i-ink);
  box-shadow:none; font-size:14px}
.think{align-self:flex-start; font-size:12.5px; color:var(--muted); font-style:italic;
  padding:2px 4px; max-width:88%; white-space:pre-wrap}
.dots{display:inline-flex; gap:4px; align-items:center; padding:4px 2px}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blip 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s} .dots i:nth-child(3){animation-delay:.36s}
@keyframes blip{0%,60%,100%{opacity:.25} 30%{opacity:1}}
.askbar{position:sticky; bottom:0; background:var(--page); padding:9px 0 calc(6px + env(safe-area-inset-bottom));
  display:flex; gap:8px; align-items:flex-end; margin-top:6px}
.askbar textarea{flex:1; min-height:46px; max-height:132px; resize:none; padding:12px 14px;
  font:inherit; font-size:16px; border:0; border-radius:16px; background:var(--surface); color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--ring)}
.askbar textarea:focus{outline:none; box-shadow:inset 0 0 0 1.5px var(--accent)}
.askbar button{flex:none; width:46px; height:46px; border:0; border-radius:50%; background:var(--accent);
  color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer}
.askbar button:disabled{background:var(--ring); color:var(--muted)}
.mictip{font-size:12.5px; color:var(--muted); margin:0 4px 8px; display:flex; gap:7px; align-items:flex-start}
.mictip svg{flex:none; margin-top:1px}
.costline{font-size:11.5px; color:var(--muted); text-align:center; margin:2px 0 0}
@media (prefers-reduced-motion: reduce){ .dots i{animation:none; opacity:.6} }

/* video overlay */
.overlay{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.85);
  display:flex; align-items:center; justify-content:center; flex-direction:column; padding:16px}
.overlay .close{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px;
  border:0; background:rgba(255,255,255,.15); color:#fff; width:38px; height:38px; border-radius:999px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center}
.overlay video, .overlay iframe{width:100%; max-width:560px; aspect-ratio:16/9; border:0; border-radius:12px; background:#000}
.overlay .ytlink{color:#9ec5f4; margin-top:12px; font-size:14px}

.note-inline{white-space:pre-wrap; color:var(--ink-2); font-size:15px}
a.plain{color:var(--accent); text-decoration:none; font-weight:600}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--ink); color:var(--page); padding:10px 18px; border-radius:999px; font-size:14px; font-weight:650;
  z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap}
.toast.show{opacity:1}
</style>

<script>
'use strict';
const APP_VER='v37';   /* bumped with the service worker so the build is visible in the app */
/* ================= IndexedDB ================= */
const DB_NAME='shoulder-trainer', DB_VER=1;
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open(DB_NAME,DB_VER);
    rq.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv',{keyPath:'key'});
      if(!d.objectStoreNames.contains('entries')) d.createObjectStore('entries',{keyPath:'id'});
      if(!d.objectStoreNames.contains('videos')) d.createObjectStore('videos',{keyPath:'id'});
    };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode), s=t.objectStore(store);
    let out; const r=fn(s); if(r&&'onsuccess'in r){ r.onsuccess=()=>out=r.result; }
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}
const kvGet =k=>tx('kv','readonly',s=>s.get(k)).then(r=>r?r.value:undefined);
const kvSet =(k,v)=>tx('kv','readwrite',s=>s.put({key:k,value:v}));
const entryPut=e=>tx('entries','readwrite',s=>s.put(e));
const entryDel=id=>tx('entries','readwrite',s=>s.delete(id));
const entryAll=()=>tx('entries','readonly',s=>s.getAll());
const videoPut=(id,blob)=>tx('videos','readwrite',s=>s.put({id,blob}));
const videoGet=id=>tx('videos','readonly',s=>s.get(id)).then(r=>r?r.blob:null);
const videoDel=id=>tx('videos','readwrite',s=>s.delete(id));

/* ================= state & seed ================= */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let S={templates:null, entries:[]};

function seedTemplates(){
  const ex=(name,cue,kind,value,sets,reps,mode,youtube)=>({id:uid(),name,cue:cue||'',load:{kind,value},sets,reps,mode:mode||'reps',youtube:youtube||'',videoId:null});
  return {
    A:{key:'A',name:'Session A',exercises:[
      ex('Wall Slides','Band looped around wrists, walk/slide up the wall','bandColor','red',3,10),
      ex('Watson Shrug','Elbow next to body, pull to back of skull','bandColor','blue',3,20),
      ex('Lateral Raise 90/90','Dumbbell raise','kg',5,3,15,'reps','https://youtu.be/DSSjBbE4WNU'),
    ]},
    B:{key:'B',name:'Session B',exercises:[
      ex('Internal Rotation wiper 90F','Arm up in front, internal rotation','bandKg',20,3,10),
      ex('External Rotation wiper 90F','Arm up in front, external rotation','bandKg',10,3,10),
      ex('Bent Over Row (DB)','','kg',7.5,3,10),
      ex('Floor Press (chest)','','kg',7.5,3,12),
      ex('Standing Cable Row','','bandKg',50,3,20),
      ex('Military Shoulder Press','Standing','kg',7.5,3,10),
    ]},
    C:{key:'C',name:'Session C',exercises:[
      ex('Pallof Press (core)','','bandKg',20,3,20),
      ex('Dead Bug','','none',null,3,20),
      ex('Hip Flexor Stretch','Per side','none',null,3,10,'secs'),
    ]},
  };
}
async function loadState(){
  let t=await kvGet('templates');
  if(!t){ t=seedTemplates(); await kvSet('templates',t); }
  // migration guard: ensure fields exist
  for(const k of ['A','B','C']) if(t[k]) t[k].exercises.forEach(e=>{ if(!e.mode)e.mode='reps'; if(!('videoId'in e))e.videoId=null;
    if(LEVELLED.test(e.name)&&!e.levels){
      e.levels=LEVEL_NAMES.map(name=>({name,sets:e.sets,reps:e.reps}));
      e.level=0;
    } });
  S.templates=t;
  S.plan=(await kvGet('weekPlan'))||[null,null,null,null,null,null,null];
  await seedHistory();
  S.entries=(await entryAll()).sort((a,b)=> (b.date.localeCompare(a.date)) || (b.createdAt-a.createdAt));
  // one-workout-per-day model: legacy entries carry a single `session`
  S.entries.forEach(e=>{ if(e.type==='workout'&&!e.sessions) e.sessions=e.session?[e.session]:[]; });
  await backfillLevels();
}
/* Everything logged before levels existed was done on the bed. */
async function backfillLevels(){
  if(await kvGet('levelBackfillV1')) return;
  for(const e of S.entries){
    if(e.type!=='workout'||!e.exercises) continue;
    let touched=false;
    for(const x of e.exercises)
      if(LEVELLED.test(x.name)&&!x.level){ x.level={i:0,name:LEVEL_NAMES[0]}; touched=true; }
    if(touched) await entryPut(e);
  }
  await kvSet('levelBackfillV1',1);
}

/* One-time import of the pre-app paper log (July 2026). Runs once per device,
   guarded by a flag, so it never duplicates or touches entries captured later. */
async function seedHistory(){
  if(await kvGet('seedHistoryV1')) return;
  const H=[
    ['2026-07-01','B','4,5,8, 9, 6,7'],
    ['2026-07-03','B','4,5,8, 9, 6,7'],
    ['2026-07-05','A',''],
    ['2026-07-07','B',''],
    ['2026-07-09','B',''],
    ['2026-07-11','A',''],
    ['2026-07-13','B',''],
    ['2026-07-15','B',''],
    ['2026-07-17','A',''],
    ['2026-07-19','B',''],
    ['2026-07-20','INJURY','Shoulder pain kicked in'],
    ['2026-07-21','INJURY','Break - shoulder pain (easing)'],
    ['2026-07-25','B',''],
    ['2026-07-27','A',''],
  ];
  for(const [date,kind,text] of H){
    const createdAt=new Date(date+'T12:00:00').getTime();
    if(kind==='INJURY'){
      await entryPut({id:uid(), type:'injury', date, createdAt, comments:text});
    } else {
      const t=S.templates[kind];
      if(!t) continue;
      await entryPut({id:uid(), type:'workout', session:kind, date, createdAt, note:text,
        exercises:t.exercises.map(e=>({name:e.name, cue:e.cue, load:JSON.parse(JSON.stringify(e.load)),
          sets:e.sets, reps:e.reps, mode:e.mode, skipped:false,
          youtube:e.youtube||'', videoId:e.videoId||null, videoOwned:false}))});
    }
  }
  await kvSet('seedHistoryV1',true);
}
const saveTemplates=()=>kvSet('templates',S.templates);
/* what was actually done becomes the default for next time */
async function syncDefaults(rows){
  let changed=false;
  for(const r of rows){
    if(r.skipped) continue;
    for(const k of ['A','B','C']){
      const te=S.templates[k]&&S.templates[k].exercises.find(x=>x.name===r.name);
      if(!te) continue;
      if(JSON.stringify(te.load)!==JSON.stringify(r.load)){ te.load=JSON.parse(JSON.stringify(r.load)); changed=true; }
      if(te.sets!==r.sets){ te.sets=r.sets; changed=true; }
      if(te.reps!==r.reps){ te.reps=r.reps; changed=true; }
      /* a levelled exercise files its numbers under the level they were done at,
         so a short floor session never overwrites the bed figures */
      if(te.levels&&r.level&&te.levels[r.level.i]){
        const L=te.levels[r.level.i];
        if(L.sets!==r.sets||L.reps!==r.reps){ L.sets=r.sets; L.reps=r.reps; changed=true; }
        if(te.level!==r.level.i){ te.level=r.level.i; changed=true; }
      }
    }
  }
  if(changed) await saveTemplates();
}
/* newest workout day on record — editing that one still counts as "what I last did" */
const latestWorkoutDate=()=>S.entries.filter(e=>e.type==='workout')
  .reduce((m,e)=>e.date>m?e.date:m,'');

async function saveEntry(e){ await entryPut(e);
  S.entries=S.entries.filter(x=>x.id!==e.id).concat([e]).sort((a,b)=>(b.date.localeCompare(a.date))||(b.createdAt-a.createdAt)); }
/* combine several workout entries logged on the same date into one */
async function mergeDay(date){
  const list=S.entries.filter(e=>e.type==='workout'&&e.date===date)
    .sort((a,b)=>a.createdAt-b.createdAt);
  if(list.length<2) return;
  const base=list[0];
  base.sessions=(base.sessions&&base.sessions.length)?base.sessions.slice():(base.session?[base.session]:[]);
  for(const other of list.slice(1)){
    const os=(other.sessions&&other.sessions.length)?other.sessions:(other.session?[other.session]:[]);
    for(const s of os) if(!base.sessions.includes(s)) base.sessions.push(s);
    for(const x of other.exercises){
      const ex=base.exercises.find(v=>v.name===x.name);
      if(ex){ ex.load=x.load; ex.sets=x.sets; ex.reps=x.reps; ex.skipped=ex.skipped&&x.skipped; }
      else base.exercises.push(x);
    }
    if(other.note) base.note=base.note?base.note+'\n'+other.note:other.note;
  }
  base.sessions.sort();
  await saveEntry(base);
  for(const other of list.slice(1)) await entryDel(other.id);
  S.entries=S.entries.filter(e=>!list.slice(1).some(o=>o.id===e.id));
}
async function deleteEntry(id){
  const e=S.entries.find(x=>x.id===id);
  if(e&&e.exercises) for(const x of e.exercises) if(x.videoId&&x.videoOwned) await videoDel(x.videoId).catch(()=>{});
  await entryDel(id); S.entries=S.entries.filter(x=>x.id!==id);
}

/* ================= helpers ================= */
const $=sel=>document.querySelector(sel);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function fmtDate(iso){
  const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const today=todayStr();
  if(iso===today) return 'Today';
  const yd=new Date(); yd.setDate(yd.getDate()-1);
  if(dt.getFullYear()===yd.getFullYear()&&dt.getMonth()===yd.getMonth()&&dt.getDate()===yd.getDate()) return 'Yesterday';
  return dt.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:(dt.getFullYear()===new Date().getFullYear()?undefined:'numeric')});
}
function fmtLoad(load,level){
  let base='';
  if(!load||load.kind==='none') base='bodyweight';
  else if(load.kind==='kg') base=load.value+' kg';
  else if(load.kind==='bandKg') base=load.value+' kg band';
  else if(load.kind==='bandColor') base=load.value+' band';
  const n=level&&level.name;
  return n?(base?base+' · '+n:n):base;
}
/* Planks are the one place where the load never changes but the exercise still
   gets harder, so they carry named levels instead. Each level remembers its own
   sets and hold, because a floor plank is nothing like a bed plank. */
const LEVELLED=/^planking (front|side)$/i;
const LEVEL_NAMES=['On bed','On floor'];
/* the levels defined for an exercise, looked up by name across the sessions */
function levelsFor(name){
  for(const k of ['A','B','C']){
    const te=S.templates&&S.templates[k]&&S.templates[k].exercises.find(x=>x.name===name);
    if(te&&te.levels) return te.levels;
  }
  return null;
}
/* the level a template exercise currently sits at, for display */
const tmplLevel=e=>e.levels?{i:e.level||0,name:e.levels[e.level||0].name}:null;
function fmtVol(x){ return x.sets+' × '+x.reps+(x.mode==='secs'?' s':''); }
function weekCount(){
  const now=new Date(); const day=(now.getDay()+6)%7; // Mon=0
  const mon=new Date(now); mon.setDate(now.getDate()-day); mon.setHours(0,0,0,0);
  const monISO=mon.getFullYear()+'-'+String(mon.getMonth()+1).padStart(2,'0')+'-'+String(mon.getDate()).padStart(2,'0');
  return S.entries.filter(e=>e.type==='workout'&&e.date>=monISO).length;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function ytId(url){
  if(!url) return null;
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/))([A-Za-z0-9_-]{6,20})/);
  return m?m[1]:null;
}
/* little confetti burst when an exercise is completed */
function burst(row){
  const host=row.querySelector('.extitle')||row;
  const b=document.createElement('span'); b.className='burst';
  const colors=['#0ca30c','#2a78d6','#eda100','#e87ba4','#1baf7a'];
  for(let i=0;i<12;i++){
    const p=document.createElement('i');
    const ang=(Math.PI*2*i)/12+Math.random()*0.4, dist=26+Math.random()*22;
    p.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
    p.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*60).toFixed(0)+'ms';
    b.appendChild(p);
  }
  host.appendChild(b);
  setTimeout(()=>b.remove(),900);
  if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
}
/* inline vector icons (stroke follows currentColor) */
const ICONS={
  plus:'<path d="M12 5v14M5 12h14"/>',
  activity:'<path d="M22 12h-3.5L15.5 20 8.5 4 5.5 12H2"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4"/><path d="M12 16.8h.01"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  chevU:'<path d="m6 15 6-6 6 6"/>',
  chevD:'<path d="m6 9 6 6 6-6"/>',
  play:'<path d="M8.5 5.5 18 12l-9.5 6.5Z" fill="currentColor" stroke="none"/>',
  pencil:'<path d="M17.2 3.3a2.4 2.4 0 1 1 3.5 3.5L7.5 20 3 21l1-4.5Z"/>',
  note:'<path d="M4 4h16v13H9l-5 4z"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="m5 13 4.5 4.5L19 7"/>',
  waves:'<path d="M2 7.5c2.5-2 4.5 2 7 0s4.5-2 7 0 4.5 2 6 .5"/><path d="M2 13c2.5-2 4.5 2 7 0s4.5-2 7 0 4.5 2 6 .5"/><path d="M2 18.5c2.5-2 4.5 2 7 0s4.5-2 7 0 4.5 2 6 .5"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/>',
  send:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',
  lotus:'<path d="M12 4c1.9 1.7 2.9 3.7 2.9 6S13.9 14.3 12 16c-1.9-1.7-2.9-3.7-2.9-6S10.1 5.7 12 4z"/><path d="M12 16c-2.4 0-4.4-1-6-3 2.6-1.2 4.6-.9 6 1 1.4-1.9 3.4-2.2 6-1-1.6 2-3.6 3-6 3z"/><path d="M4 18.5c2.4 1.7 5 2.5 8 2.5s5.6-.8 8-2.5"/>',
  bike:'<circle cx="5.5" cy="17.5" r="3.4"/><circle cx="18.5" cy="17.5" r="3.4"/><path d="m5.5 17.5 4.6-8.5h4.6l3.8 8.5"/><path d="M9 9h4.8"/>',
  run:'<circle cx="15.5" cy="4.2" r="1.9"/><path d="M13.5 21.5 15 15l-3.2-2.6.9-4.9 3.3 3.4 3 .8"/><path d="M12.7 7.5 9 8.8l-1 3.2M11.8 12.4 7 16l-2.5 5.5"/>',
};
const ico=(n,s=20,w=2)=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';

/* ================= video overlay ================= */
let overlayEl=null;
async function openVideo(ex){
  closeOverlay();
  const ov=document.createElement('div'); ov.className='overlay'; overlayEl=ov;
  const close=document.createElement('button'); close.className='close'; close.innerHTML=ico('x',17);
  close.onclick=closeOverlay; ov.appendChild(close);
  ov.addEventListener('click',e=>{ if(e.target===ov) closeOverlay(); });
  if(ex.videoId){
    const blob=await videoGet(ex.videoId);
    if(blob){ const v=document.createElement('video'); v.controls=true; v.playsInline=true; v.src=URL.createObjectURL(blob); ov._url=v.src; ov.appendChild(v); }
    else{ const p=document.createElement('p'); p.style.color='#fff'; p.textContent='Video not found on this device.'; ov.appendChild(p); }
  } else if(ytId(ex.youtube)){
    const id=ytId(ex.youtube);
    const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+id+'?playsinline=1';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true; ov.appendChild(f);
    const a=document.createElement('a'); a.className='ytlink'; a.href=ex.youtube; a.target='_blank'; a.rel='noopener';
    a.textContent='Open in YouTube ↗'; ov.appendChild(a);
  }
  document.body.appendChild(ov);
}
function closeOverlay(){ if(overlayEl){ if(overlayEl._url) URL.revokeObjectURL(overlayEl._url); overlayEl.remove(); overlayEl=null; } }

/* ================= router ================= */
function nav(hash){
  /* walking away while the bell rings counts as having heard it */
  if(typeof bellRinging==='function'&&bellRinging()) cancelBell();
  if(typeof clearConfetti==='function') clearConfetti();
  location.hash=hash;
}

function setBar(title, backHash){

function setTab(name){

function render(){
  closeOverlay();
  draftFlush=null;
  const h=location.hash.replace(/^#/,'')||'home';
  const parts=h.split('/');
  const M=$('#main'); M.innerHTML=''; window.scrollTo(0,0);
  if(typeof coachCleanup==='function'){ coachCleanup(); coachCleanup=null; }
  try{
    if(parts[0]==='home') return viewHome(M);
    if(parts[0]==='capture'&&!parts[1]) return viewPick(M);
    if(parts[0]==='capture') return viewCapture(M,parts[1],null);
    if(parts[0]==='physio') return viewSimple(M,'physio',parts[1]||null);
    if(parts[0]==='injury') return viewSimple(M,'injury',parts[1]||null);
    if(parts[0]==='run') return viewSimple(M,'run',parts[1]||null);
    if(parts[0]==='swim') return viewSwim(M,parts[1]||null);
    if(parts[0]==='bike') return viewBike(M,parts[1]||null);
    if(parts[0]==='meditate') return viewMeditate(M,parts[1]||null);
    if(parts[0]==='medlog') return viewMedLog(M,parts[1]||null);
    if(parts[0]==='coach') return viewCoach(M,parts[1]||null)
      .catch(err=>{ M.innerHTML='<p class="empty">Something went wrong: '+esc(err.message)+'</p>'; console.error(err); });
    if(parts[0]==='entry') return viewDetail(M,parts[1]);
    if(parts[0]==='editworkout') return viewCapture(M,null,parts[1]);
    if(parts[0]==='settings') return viewSettings(M);
    if(parts[0]==='report') return viewReport(M);
    if(parts[0]==='exercise') return viewExercise(M,parts[1],parts[2]);
    if(parts[0]==='progress') return viewProgress(M,parts.slice(1).join('/'));
    viewHome(M);
  }catch(err){ M.innerHTML='<p class="empty">Something went wrong: '+esc(err.message)+'</p>'; console.error(err); }
}

/* Capture new (sessionKey set) or edit existing workout (editId set) */
/* ---- in-progress workout draft ----
   The capture screen used to hold ticks, set marks and the note in memory only, so
   iOS reclaiming the app mid-workout lost them. Every change is now written to
   localStorage (synchronous, so it survives even an abrupt eviction). */
const DRAFT_KEY='shoulder.capture.draft';
const DRAFT_TTL=18*3600*1000;
function readDraft(){
  try{
    const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
    if(!d||!d.updatedAt||Date.now()-d.updatedAt>DRAFT_TTL||!d.ex) return null;
    return d;
  }catch(e){ return null; }
}
function writeDraft(d){
  try{ localStorage.setItem(DRAFT_KEY,JSON.stringify(Object.assign({v:1},d,{updatedAt:Date.now()}))); }
  catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
const draftProgress=d=>{
  const v=Object.values(d.ex||{});
  return {done:v.filter(x=>x.done).length, total:v.length,
    /* only part-finished exercises count — a completed one fills all its marks */
    sets:v.filter(x=>!x.done).reduce((n,x)=>n+(x.setsDone||0),0)};
};
/* the capture screen registers a flusher so the draft is written when iOS backgrounds us */
let draftFlush=null;
function viewCapture(M,sessionKey,editId){
  setTab('home');
  let entry, isEdit=false, draftEx={};
  if(editId){
    const src=S.entries.find(x=>x.id===editId);
    if(!src){ M.innerHTML='<p class="empty">Entry not found.</p>'; setBar('Edit','home'); return; }
    entry=JSON.parse(JSON.stringify(src)); isEdit=true; sessionKey=entry.session;
    setBar('Edit Workout','entry/'+editId);
  } else {
    const t=S.templates[sessionKey];
    if(!t){ nav('capture'); return; }
    entry={
      id:uid(), type:'workout', session:sessionKey, sessions:[sessionKey], date:todayStr(), createdAt:Date.now(), note:'',
      exercises:t.exercises.map(e=>({
        name:e.name, cue:e.cue, load:JSON.parse(JSON.stringify(e.load)),
        sets:e.sets, reps:e.reps, mode:e.mode, skipped:false, level:tmplLevel(e),
        youtube:e.youtube||'', videoId:e.videoId||null, videoOwned:false
      }))
    };
    // prefill from today's workout so re-capturing shows what's already logged
    const seedFrom=S.entries.find(e=>e.type==='workout'&&e.date===todayStr());
    if(seedFrom) for(const r of entry.exercises){
      const ex=seedFrom.exercises.find(x=>x.name===r.name);
      if(ex){ r.load=JSON.parse(JSON.stringify(ex.load)); r.sets=ex.sets; r.reps=ex.reps;
        if(ex.level) r.level=JSON.parse(JSON.stringify(ex.level)); }
    }
    /* an interrupted workout wins over the defaults */
    const d=readDraft();
    if(d&&d.session===sessionKey){
      draftEx=d.ex; entry.date=d.date||entry.date; entry.note=d.note||'';
      for(const r of entry.exercises){
        const dx=draftEx[r.name]; if(!dx) continue;
        if(dx.load!==undefined&&r.load) r.load.value=dx.load;
        if(dx.sets!=null) r.sets=dx.sets;
        if(dx.reps!=null) r.reps=dx.reps;
        if(dx.level!=null&&r.level){ const lv=levelsFor(r.name);
          if(lv&&lv[dx.level]) r.level={i:dx.level,name:lv[dx.level].name}; }
        r.skipped=!!dx.skipped;
      }
    }
    setBar('Session '+sessionKey,'capture');
  }
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="field"><label>Date</label><input type="date" id="fDate" value="${entry.date}" max="${todayStr()}"></div>
    ${isEdit?'':'<div class="weekline" id="doneCount" style="margin-top:2px"></div>'}<div id="exlist"></div>
    ${isEdit?'<button class="btn secondary" id="bAddEx" style="margin-bottom:14px">+ Add exercise</button><div id="addSel" class="field hidden"></div>':''}
    <div class="field"><label>Note (optional)</label><textarea id="fNote" placeholder="e.g. shoulder felt tight">${esc(entry.note)}</textarea></div>
    <button class="btn" id="bSave">${isEdit?'Save Changes':'Save Workout'}</button>`;
  M.appendChild(wrap);
  const list=$('#exlist');
  /* live workout state: which exercises are ticked and how many sets each has done */
  const doneSet=new Set();
  const setCounts=new Map();
  const saveDraftNow=()=>{
    if(isEdit) return;
    const ex={};
    entry.exercises.forEach(x=>{
      ex[x.name]={load:x.load?x.load.value:null, sets:x.sets, reps:x.reps,
        level:x.level?x.level.i:null,
        skipped:!!x.skipped, done:doneSet.has(x), setsDone:setCounts.get(x)||0};
    });
    const dEl=$('#fDate'), nEl=$('#fNote');
    writeDraft({session:sessionKey, date:dEl?dEl.value:entry.date, note:nEl?nEl.value:'', ex});
  };
  if(!isEdit) draftFlush=saveDraftNow;
  const updateCount=()=>{ const el=$('#doneCount'); if(!el) return;
    el.textContent=doneSet.size+' of '+entry.exercises.filter(x=>!x.skipped).length+' done'; };
  const addRowEl=(x)=>{
    const row=document.createElement('div'); row.className='exrow'+(x.skipped?' skipped':'');
    const hasVid=x.videoId||ytId(x.youtube);
    row.innerHTML=`<div class="extitle">
        ${isEdit?'':'<button class="donebtn" title="Mark done">'+ico('check',18)+'</button>'}
        <span class="exname">${esc(x.name)}</span>
        ${hasVid?'<button class="videobtn" title="Watch video">'+ico('play',15)+'</button>':''}
        ${isEdit?'<button class="skipbtn '+(x.skipped?'on':'')+'">'+(x.skipped?'Skipped':'Skip')+'</button>':''}
      </div>
      ${x.cue?'<div class="cue">'+esc(x.cue)+'</div>':''}
      <div class="exbody"><div class="controls"></div>
        ${isEdit?'':'<div class="setbar"><span class="setmarks"></span><button class="setbtn">Set done</button></div>'}
      </div>`;
    if(hasVid) row.querySelector('.videobtn').onclick=()=>openVideo(x);
    const doneB=row.querySelector('.donebtn');
    const setB=row.querySelector('.setbtn'), marksEl=row.querySelector('.setmarks');
    const dx=draftEx[x.name]||null;
    let sets=(dx&&dx.setsDone)||0;   // sets ticked off so far, restored from the draft
    setCounts.set(x,sets);
    const target=()=>Math.max(1,Math.round(x.sets)||1);
    const setDone=(on,celebrate)=>{
      row.classList.toggle('done',on);
      if(doneB) doneB.classList.toggle('on',on);
      on?doneSet.add(x):doneSet.delete(x);
      if(setB) setB.classList.toggle('hidden',on);
      if(on&&celebrate) burst(row);
      updateCount(); saveDraftNow();
    };
    const renderMarks=()=>{
      if(!marksEl) return;
      const t=target(); if(sets>t) sets=t;
      setCounts.set(x,sets);
      marksEl.innerHTML='';
      for(let i=0;i<t;i++){
        const d=document.createElement('i');
        d.className='setmark'+(i<sets?' on':'');
        if(i===sets-1) d.classList.add('pop');
        marksEl.appendChild(d);
      }
      marksEl.title=sets+' of '+t+' sets';
    };
    if(doneB) doneB.onclick=()=>{
      const on=!row.classList.contains('done');
      sets=on?target():0; renderMarks(); setDone(on,on);
    };
    if(setB) setB.onclick=()=>{
      if(sets>=target()) return;
      sets++; renderMarks(); saveDraftNow();
      if(sets>=target()) setDone(true,true);
    };
    renderMarks();
    if(dx&&dx.done) setDone(true,false);   // restore a completed exercise
    const skipB=row.querySelector('.skipbtn');
    if(skipB) skipB.onclick=()=>{ x.skipped=!x.skipped; row.classList.toggle('skipped',x.skipped);
      skipB.classList.toggle('on',x.skipped); skipB.textContent=x.skipped?'Skipped':'Skip';
      updateCount(); saveDraftNow(); };
    const ctls=row.querySelector('.controls');
    // load control
    if(x.load.kind==='kg'||x.load.kind==='bandKg'){
      ctls.appendChild(stepCtl(x.load.kind==='kg'?'Weight (kg)':'Band (kg)', x.load.value, x.load.kind==='kg'?0.5:1,
        v=>{ x.load.value=v; saveDraftNow(); }));
    } else if(x.load.kind==='bandColor'){
      const c=document.createElement('div'); c.className='ctl';
      c.innerHTML=`<label>Band</label><input type="text" value="${esc(x.load.value)}">`;
      c.querySelector('input').oninput=e=>{ x.load.value=e.target.value; saveDraftNow(); }; ctls.appendChild(c);
    }
    const setsCtl=stepCtl('Sets', x.sets, 1, v=>{ x.sets=v; renderMarks();
      if(row.classList.contains('done')&&sets<target()) setDone(false,false); saveDraftNow(); });
    const repsCtl=stepCtl(x.mode==='secs'?'Hold (s)':'Reps', x.reps, 1, v=>{ x.reps=v; saveDraftNow(); });
    const lv=x.level?levelsFor(x.name):null;
    if(lv){
      const c=document.createElement('div'); c.className='ctl wide';
      c.innerHTML='<label>Level</label><div class="levelseg">'+
        lv.map((l,i)=>`<button type="button" class="lvbtn${i===x.level.i?' on':''}">${esc(l.name)}</button>`).join('')+
        '</div>';
      c.querySelectorAll('.lvbtn').forEach((btn,i)=>{
        btn.onclick=()=>{
          if(i===x.level.i) return;
          x.level={i,name:lv[i].name};
          /* each level keeps its own numbers — a floor plank is not a bed plank */
          x.sets=lv[i].sets; x.reps=lv[i].reps;
          setsCtl.querySelector('input').value=x.sets;
          repsCtl.querySelector('input').value=x.reps;
          c.querySelectorAll('.lvbtn').forEach((b,j)=>b.classList.toggle('on',j===i));
          renderMarks();
          if(row.classList.contains('done')&&sets<target()) setDone(false,false);
          saveDraftNow();
        };
      });
      ctls.appendChild(c);
    }
    ctls.appendChild(setsCtl);
    ctls.appendChild(repsCtl);
    list.appendChild(row);
  };
  entry.exercises.forEach(addRowEl);
  updateCount();
  if(!isEdit){
    $('#fNote').oninput=saveDraftNow;
    $('#fDate').onchange=saveDraftNow;
  }
  if(isEdit) $('#bAddEx').onclick=()=>{
    const present=new Set(entry.exercises.map(x=>x.name)), seen=new Set(), opts=[];
    for(const k of ['A','B','C']) for(const e of S.templates[k].exercises)
      if(!present.has(e.name)&&!seen.has(e.name)){ seen.add(e.name); opts.push({k,e}); }
    if(!opts.length){ alert('All exercises are already in this workout.'); return; }
    const box=$('#addSel'); box.classList.remove('hidden');
    box.innerHTML='<select id="fAddEx"><option value="">Choose exercise…</option>'+
      opts.map((o,i)=>'<option value="'+i+'">'+esc(o.k+' · '+o.e.name)+'</option>').join('')+'</select>';
    $('#fAddEx').onchange=ev=>{
      const o=opts[+ev.target.value]; if(!o) return;
      const e=o.e;
      const x={name:e.name, cue:e.cue, load:JSON.parse(JSON.stringify(e.load)),
        sets:e.sets, reps:e.reps, mode:e.mode, skipped:false, level:tmplLevel(e),
        youtube:e.youtube||'', videoId:e.videoId||null, videoOwned:false};
      entry.exercises.push(x); addRowEl(x);
      box.classList.add('hidden'); box.innerHTML='';
    };
  };
  const doSave=async()=>{
    const date=$('#fDate').value||todayStr();
    const note=$('#fNote').value.trim();
    if(isEdit){
      entry.date=date; entry.note=note;
      await saveEntry(entry);
      /* edits to the latest day update the defaults too; older days stay history */
      if(entry.date>=latestWorkoutDate()) await syncDefaults(entry.exercises);
      toast('Workout updated'); nav('entry/'+entry.id); return;
    }
    /* only ticked-off exercises make it into the day */
    const chosen=entry.exercises.filter(x=>doneSet.has(x));
    if(!chosen.length){ alert('Tick off at least one exercise before saving.'); return; }
    /* one workout per day: merge into that day's entry if it exists */
    let b=S.entries.find(e=>e.type==='workout'&&e.date===date);
    if(!b){
      entry.date=date; entry.note=note; entry.exercises=chosen; b=entry;
    } else {
      for(const r of chosen){
        const ex=b.exercises.find(x=>x.name===r.name);
        if(ex){ ex.load=r.load; ex.sets=r.sets; ex.reps=r.reps; ex.skipped=false; }
        else b.exercises.push(r);
      }
      if(!b.sessions) b.sessions=b.session?[b.session]:[];
      if(!b.sessions.includes(sessionKey)) b.sessions.push(sessionKey);
      if(note) b.note=b.note?b.note+'\n'+note:note;
    }
    await saveEntry(b);
    await syncDefaults(chosen);
    clearDraft(); draftFlush=null;
    toast('Workout saved');
    nav('home');
  };
  formBar(isEdit?'Edit Workout':'Session '+sessionKey, isEdit?('entry/'+editId):'capture', doSave);
  $('#bSave').onclick=doSave;
}
function stepCtl(label,value,step,onChange){
  const d=document.createElement('div'); d.className='ctl';
  d.innerHTML=`<label>${esc(label)}</label><div class="stepper">
    <button type="button">−</button><input type="text" inputmode="decimal" value="${value==null?'':value}"><button type="button">+</button></div>`;
  const [minus,plus]=d.querySelectorAll('button'); const inp=d.querySelector('input');
  const set=v=>{ v=Math.round(v*100)/100; if(v<0)v=0; inp.value=v; onChange(v); };
  minus.onclick=()=>set((parseFloat(inp.value)||0)-step);
  plus.onclick=()=>set((parseFloat(inp.value)||0)+step);
  inp.oninput=()=>{ const v=parseFloat(inp.value.replace(',','.')); if(!isNaN(v)) onChange(v); };
  inp.onblur=()=>{ const v=parseFloat(inp.value.replace(',','.')); set(isNaN(v)?0:v); };
  return d;
}

/* the week at a glance: one slot per day, today marked */
function weekPlanStrip(){
  const wrap=document.createElement('div'); wrap.className='weekplan';
  const strip=document.createElement('div'); strip.className='wpdays';
  S.plan.forEach((k,i)=>{
    const d=document.createElement('div'); d.className='wpday'+(i===todayIdx()?' today':'');

      (k?`<span class="wpslot badge ${k}">${k}</span>`:`<span class="wpslot none">–</span>`);
    strip.appendChild(d);
  });
  wrap.appendChild(strip);
  const k=S.plan[todayIdx()];
  const line=document.createElement('div'); line.className='wptoday';
  line.textContent=k?('Today · '+S.templates[k].name):'Today · rest day';
  wrap.appendChild(line);
  return wrap;

    await saveTemplates(); toast('Saved'); nav('settings');

  formBar((isNew?'New exercise':'Edit exercise')+' · '+sess,'settings',doSave);

  const bDel=$('#bDel');

    t.exercises=t.exercises.filter(x=>x.id!==w.id);
    await saveTemplates(); toast('Removed'); nav('settings');
  };

/* ============ progress chart ============ */
function progressSeries(){
  // exercise name -> [{date, value}] from non-skipped workout exercises with numeric load
  const map=new Map();
  const sorted=[...S.entries].filter(e=>e.type==='workout').sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  for(const e of sorted) for(const x of e.exercises){
    if(x.skipped) continue;
    if(!x.load||(x.load.kind!=='kg'&&x.load.kind!=='bandKg')) continue;
    const v=parseFloat(x.load.value); if(isNaN(v)) continue;
    if(!map.has(x.name)) map.set(x.name,[]);
    const reps=parseFloat(x.reps);
    map.get(x.name).push({date:e.date, value:v, kind:x.load.kind, reps:isNaN(reps)?null:reps, mode:x.mode});
  }
  // swims trend their lap count
  const swims=[...S.entries].filter(e=>e.type==='swim'&&e.laps!=null)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  if(swims.length){
    const a=[]; a.unit='laps';
    swims.forEach(e=>a.push({date:e.date, value:e.laps}));
    map.set('Swimming (laps)',a);
  }
  /* levelled exercises trend the level itself, with the hold alongside it */
  const lvlBy=new Map();
  for(const e of [...S.entries].filter(e=>e.type==='workout')
      .sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt)){
    for(const x of e.exercises||[]){
      if(x.skipped||!x.level) continue;
      const names=(levelsFor(x.name)||[]).map(l=>l.name);
      if(names.length<2) continue;
      const key=x.name+' (level)';
      if(!lvlBy.has(key)){ const a=[]; a.unit='level'; a.levels=names; a.exercise=x.name; lvlBy.set(key,a); }
      const reps=parseFloat(x.reps);
      lvlBy.get(key).push({date:e.date, value:x.level.i+1, levelName:x.level.name,
        reps:isNaN(reps)?null:reps, mode:x.mode});
    }
  }

/* which data tables the user left open, so an edit does not collapse them */
const OPEN_TABLES=new Set();
/* write an edited cell back to the day it belongs to */
async function applyCellEdit(series,date,field,value){
  let e=null;
  if(series==='Swimming (laps)'){
    e=S.entries.find(x=>x.type==='swim'&&x.date===date); if(e) e.laps=value;
  } else if(series==='Bike ride (km)'){
    e=S.entries.find(x=>x.type==='bike'&&x.date===date); if(e) e.km=value;
  } else {
    e=S.entries.find(x=>x.type==='workout'&&x.date===date);
    const ex=e&&e.exercises.find(x=>x.name===series);
    if(!ex) return false;
    if(field==='reps') ex.reps=value; else ex.load.value=value;
  }
  if(!e) return false;
  await saveEntry(e);
  /* same rule as the edit screen: the latest day also refreshes the defaults */
  if(e.type==='workout'&&e.date>=latestWorkoutDate()) await syncDefaults(e.exercises);
  return true;
}
function startCellEdit(btn,series){
  const back=rerender;
  const inp=document.createElement('input');
  inp.type='text'; inp.inputMode='decimal'; inp.className='celledit';
  inp.value=btn.textContent==='—'?'':btn.textContent;
  const date=btn.dataset.d, field=btn.dataset.f;
  btn.replaceWith(inp);
  inp.focus(); inp.select();
  let done=false;
  const finish=async(commit)=>{
    if(done) return; done=true;
    const v=parseFloat(String(inp.value).replace(',','.'));
    if(commit&&!isNaN(v)&&v>=0){
      const ok=await applyCellEdit(series,date,field,Math.round(v*100)/100);
      if(ok) toast('Updated'); else alert('Could not find that entry.');
    }
    back();
  };
  inp.onblur=()=>finish(true);
  inp.onkeydown=ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); inp.blur(); }
    else if(ev.key==='Escape'){ done=true; back(); }
  };
}
function chartBox(name,pts){
  const box=document.createElement('div'); box.className='viz-root'; box.style.position='relative'; box.style.marginBottom='10px';
  const isLevel=pts.unit==='level';
  const unit=pts.unit?pts.unit:(pts[0].kind==='bandKg'?'kg band':'kg');
  const noun=pts.unit==='laps'?'swim':(pts.unit==='km'?'ride':(pts.unit==='points'?'day':'workout'));
  /* weight and level series both plot the hold or reps on their own right-hand axis */
  const dual=(!pts.unit||isLevel)&&pts.some(p=>p.reps!=null);
  const repLabel=pts[0].mode==='secs'?'sec':'reps';
  const latest=pts[pts.length-1], first=pts[0];
  const delta=Math.round((latest.value-first.value)*100)/100;
  const head=isLevel
    ? `latest ${esc(latest.levelName)}${latest.reps!=null?' × '+latest.reps+' '+repLabel:''}${
        delta>0?' · ▲ moved up from '+esc(first.levelName):''}`
    : `latest ${latest.value} ${unit}${dual&&latest.reps!=null?' × '+latest.reps+' '+repLabel:''}${
        delta?` · ${delta>0?'▲':'▼'} ${Math.abs(delta)} since first`:''}`;
  box.innerHTML=`<h3>${esc(name)}</h3><div class="vsub">${pts.length} ${noun}${pts.length>1?'s':''} · ${head}</div>`;
  if(dual) box.insertAdjacentHTML('beforeend',
    `<div class="vlegend"><span><i style="background:var(--chart)"></i>${esc(isLevel?'Level':unit)}</span>`+
    `<span><i style="background:var(--chart2)"></i>${esc(repLabel)}</span></div>`);
  box.appendChild(buildChart(pts,unit,dual?repLabel:null,isLevel?pts.levels:null));
  const dt=document.createElement('details'); dt.className='datatable';
  const cell=(p,f,v)=>`<td><button class="cellv" data-d="${p.date}" data-f="${f}">${v}</button></td>`;
  /* a level is a name picked during the workout, not a number to overtype */
  const flat=(v)=>`<td>${esc(String(v))}</td>`;
  dt.innerHTML='<summary>Show data</summary><table><tr><th>Date</th><th>'+esc(isLevel?'Level':unit)+'</th>'+
    (dual?'<th>'+esc(repLabel)+'</th>':'')+'</tr>'+
    pts.map(p=>`<tr><td>${esc(fmtDate(p.date))}</td>${
      isLevel?flat(p.levelName):cell(p,'value',p.value)}${
      dual?(isLevel?flat(p.reps==null?'—':p.reps):cell(p,'reps',p.reps==null?'—':p.reps)):''}</tr>`)
      .reverse().join('')+'</table>';
  dt.open=OPEN_TABLES.has(name);
  dt.ontoggle=()=>{ dt.open?OPEN_TABLES.add(name):OPEN_TABLES.delete(name); };

    '<p class="cue" style="margin:8px 2px 0">Tap a score to open that day’s sittings, where you can change the answers or delete one.</p>');
  box.appendChild(dt);

}
/* round an axis to clean tick values with a fixed number of intervals,
   so the left (weight) and right (reps) axes can share gridlines */
function niceAxis(vals,intervals){
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){ mn-=1; mx+=1; }                       // a flat line sits mid-plot
  else { const s=mx-mn; mn-=s*0.18; mx+=s*0.18; }    // breathing room
  if(mn<0&&Math.min(...vals)>=0) mn=0;
  const steps=[0.1,0.25,0.5,1,2,2.5,5,10,20,25,50,100,200,250,500];
  for(const step of steps){
    const lo=Math.floor(mn/step)*step, hi=lo+step*intervals;
    if(hi>=mx) return {lo,hi,step,
      ticks:Array.from({length:intervals+1},(_,i)=>Math.round((lo+i*step)*100)/100)};
  }
  return {lo:mn,hi:mx,step:(mx-mn)/intervals,
    ticks:Array.from({length:intervals+1},(_,i)=>Math.round((mn+i*(mx-mn)/intervals)*100)/100)};
}
function buildChart(pts,unit,repLabel,levelNames){
  const dual=!!repLabel&&pts.some(p=>p.reps!=null);
  const lv=levelNames&&levelNames.length>1?levelNames:null;
  const W=520,H=262,padL=lv?96:40,padR=dual?40:14,padT=16,padB=30,INT=lv?lv.length-1:3;
  const n=pts.length;
  /* levels are a named ladder, so the axis is one gridline per rung */
  const A=lv?{lo:0.5,hi:lv.length+0.5,ticks:lv.map((_,i)=>i+1)}:niceAxis(pts.map(p=>p.value),INT);
  const B=dual?niceAxis(pts.filter(p=>p.reps!=null).map(p=>p.reps),INT):null;
  const X=i=> n===1 ? (padL+(W-padL-padR)/2) : padL+(W-padL-padR)*(i/(n-1));
  const yOf=(v,ax)=> padT+(H-padT-padB)*(1-(v-ax.lo)/(ax.hi-ax.lo));
  const Y=v=>yOf(v,A), Y2=v=>yOf(v,B);
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label',dual?'Weight and reps over time':'Progress over time');
  const mk=(tag,attrs)=>{ const el=document.createElementNS(svgNS,tag); for(const k in attrs) el.setAttribute(k,attrs[k]); return el; };
  const txt=(x,y,s,anchor,fill)=>{ const t=mk('text',{x,y,'text-anchor':anchor,'font-size':11,
    fill,'font-family':'inherit'}); t.textContent=s; return t; };
  // gridlines with a label on each axis
  A.ticks.forEach((tv,i)=>{
    const y=yOf(tv,A);
    svg.appendChild(mk('line',{x1:padL,x2:W-padR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    svg.appendChild(txt(padL-6,y+4,lv?lv[i]:tv,'end',dual?'var(--chart)':'var(--muted)'));
    if(dual) svg.appendChild(txt(W-padR+6,y+4,B.ticks[i],'start','var(--chart2)'));
  });
  svg.appendChild(mk('line',{x1:padL,x2:W-padR,y1:H-padB,y2:H-padB,stroke:'var(--baseline)','stroke-width':1}));
  // x labels: first & last date
  svg.appendChild(txt(X(0),H-10,fmtDate(pts[0].date),n===1?'middle':'start','var(--muted)'));
  if(n>1) svg.appendChild(txt(X(n-1),H-10,fmtDate(pts[n-1].date),'end','var(--muted)'));
  // reps line first so weight reads on top
  if(dual){
    const rp=pts.map((p,i)=>({i,v:p.reps})).filter(o=>o.v!=null);
    if(rp.length>1) svg.appendChild(mk('path',{d:rp.map((o,k)=>(k?'L':'M')+X(o.i)+' '+Y2(o.v)).join(' '),
      fill:'none',stroke:'var(--chart2)','stroke-width':2,'stroke-dasharray':'5 4',
      'stroke-linejoin':'round','stroke-linecap':'round'}));
    rp.forEach(o=>{
      svg.appendChild(mk('circle',{cx:X(o.i),cy:Y2(o.v),r:5,fill:'var(--surface)'}));
      svg.appendChild(mk('circle',{cx:X(o.i),cy:Y2(o.v),r:3.5,fill:'var(--chart2)'}));
    });
  }
  if(n>1) svg.appendChild(mk('path',{d:pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.value)).join(' '),
    fill:'none',stroke:'var(--chart)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
  pts.forEach((p,i)=>{
    svg.appendChild(mk('circle',{cx:X(i),cy:Y(p.value),r:5,fill:'var(--surface)'}));
    svg.appendChild(mk('circle',{cx:X(i),cy:Y(p.value),r:4,fill:'var(--chart)'}));
  });
  // crosshair + tooltip layer
  const cross=mk('line',{x1:0,x2:0,y1:padT,y2:H-padB,stroke:'var(--baseline)','stroke-width':1,opacity:0});
  svg.appendChild(cross);
  const tip=document.createElement('div'); tip.className='viz-tip';
  const hit=mk('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});
  svg.appendChild(hit);
  function showAt(clientX){
    const r=svg.getBoundingClientRect();
    const px=(clientX-r.left)/r.width*W;
    let best=0,bd=1e9;
    for(let i=0;i<n;i++){ const d=Math.abs(X(i)-px); if(d<bd){bd=d;best=i;} }
    const p=pts[best];
    cross.setAttribute('x1',X(best)); cross.setAttribute('x2',X(best)); cross.setAttribute('opacity',1);
    tip.textContent=fmtDate(p.date)+' · '+(lv?p.levelName:p.value+' '+unit)+
      (dual&&p.reps!=null?' · '+p.reps+' '+repLabel:'');
    tip.style.left=(X(best)/W*r.width)+'px';
    tip.style.top=(Y(p.value)/H*r.height)+'px';
    tip.style.opacity=1;
  }
  function hide(){ cross.setAttribute('opacity',0); tip.style.opacity=0; }
  hit.addEventListener('pointermove',e=>showAt(e.clientX));
  hit.addEventListener('pointerdown',e=>showAt(e.clientX));
  hit.addEventListener('pointerleave',hide);
  const holder=document.createElement('div'); holder.style.position='relative';
  holder.appendChild(svg); holder.appendChild(tip);
  return holder;
}

/* ================= meditation ================= */
const MED_MIN=10;                        /* session length */
const MED_KEY='shoulder.meditation.run'; /* survives the app being reclaimed */
const medPoints=m=>1+(m.afterWake?1:0)+(m.outside?1:0);
function readRun(){
  try{ const r=JSON.parse(localStorage.getItem(MED_KEY)||'null');
    return (r&&r.startedAt)?r:null; }catch(e){ return null; }
}
const writeRun=r=>{ try{ localStorage.setItem(MED_KEY,JSON.stringify(r)); }catch(e){} };

/* --- the bell ---------------------------------------------------------
   iOS throttles JavaScript timers the moment the phone stops paying
   attention, so the chime is *scheduled* inside the audio clock at the
   instant the session starts and plays from the audio thread whether or
   not our timer is still ticking. A near-silent tone runs for the whole
   session to stop iOS suspending the context in the meantime. */
let medAudio=null, medHold=null, medBell=[], medBellFrom=0, medBellUntil=0;
function audioCtx(){
  try{
    medAudio=medAudio||new (window.AudioContext||window.webkitAudioContext)();
    if(medAudio.state==='suspended') medAudio.resume();
    return medAudio;
  }catch(e){ return null; }
}
const audioLive=()=>!!medAudio&&medAudio.state==='running';
/* call from inside a tap: unlocks audio and keeps the context awake */
function armAudio(){
  const ctx=audioCtx(); if(!ctx) return null;
  if(!medHold){
    try{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=40; g.gain.value=0.0001;
      o.connect(g); g.connect(ctx.destination); o.start();
      medHold={o,g};
    }catch(e){}
  }
  return ctx;
}
function releaseAudio(){
  try{ if(medHold){ medHold.o.stop(); medHold=null; } }catch(e){ medHold=null; }
}
/* one three-note bell at the given point on the audio clock */
function bellAt(ctx,at){
  [0,0.45,0.9].forEach((t,i)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=[528,660,792][i];
    o.connect(g); g.connect(ctx.destination);
    const s=at+t;
    g.gain.setValueAtTime(0.0001,s);
    g.gain.exponentialRampToValueAtTime(0.6,s+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,s+1.6);
    o.start(s); o.stop(s+1.7);
    medBell.push(o);
  });
}
/* four bells over about fifteen seconds — hard to sleep through */
function scheduleBell(ctx,at){
  for(let i=0;i<4;i++) bellAt(ctx,at+i*3.6);
  medBellFrom=Date.now()+Math.max(0,at-ctx.currentTime)*1000;
  /* the last bell starts at +10.8s and its final note rings out 2.6s later */
  medBellUntil=medBellFrom+13400;
}
function cancelBell(){
  medBell.forEach(o=>{ try{ o.stop(); }catch(e){} }); medBell=[]; medBellFrom=0; medBellUntil=0;
}
/* audible right now (or about to be) — not merely queued for the end of the
   session, which is ten minutes off and must survive a glance at another screen */
const bellRinging=()=>{ const t=Date.now();
  return medBell.length>0&&t>=medBellFrom-1000&&t<medBellUntil; };
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate([500,200,500,200,500]); }catch(e){} }
/* play right now — the fallback when nothing could be scheduled */
function chime(){ const ctx=audioCtx(); if(ctx) scheduleBell(ctx,ctx.currentTime+0.05); buzz(); }
/* an iPhone suspends the context when the app goes away; take it back */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&medAudio&&medAudio.state==='suspended') medAudio.resume();
});

/* A full-screen shower of paper, drawn rather than animated in CSS so a
   hundred-odd pieces cost one canvas instead of a hundred elements. */
function confetti(ms){
  try{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const old=document.getElementById('confetti'); if(old) old.remove();
    const cv=document.createElement('canvas'); cv.id='confetti';
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const W=innerWidth, H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    document.body.appendChild(cv);
    const g=cv.getContext('2d'); g.scale(dpr,dpr);
    const colors=['#4a3aa7','#2a78d6','#eb6834','#eda100','#1baf7a','#e87ba4'];
    const bits=[];
    for(let i=0;i<130;i++) bits.push({
      x:Math.random()*W, y:-20-Math.random()*H*0.6,
      w:5+Math.random()*6, h:8+Math.random()*7,
      vy:1.6+Math.random()*2.6, vx:(Math.random()-0.5)*1.4,
      rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.22,
      sway:0.6+Math.random()*1.4, phase:Math.random()*Math.PI*2,
      c:colors[i%colors.length]
    });
    const until=Date.now()+(ms||4200);
    let raf=null;
    const frame=()=>{
      g.clearRect(0,0,W,H);
      let live=false;
      for(const b of bits){
        b.y+=b.vy; b.x+=b.vx+Math.sin((b.y+b.phase*40)/38)*b.sway*0.5; b.rot+=b.vr;
        if(b.y<H+30) live=true;
        g.save(); g.translate(b.x,b.y); g.rotate(b.rot);
        g.fillStyle=b.c; g.fillRect(-b.w/2,-b.h/2,b.w,b.h);
        g.restore();
      }
      if(live&&Date.now()<until) raf=requestAnimationFrame(frame);
      else { cv.style.opacity=0; setTimeout(()=>cv.remove(),650); }
    };
    raf=requestAnimationFrame(frame);
    /* never outlive the screen that started it */
    setTimeout(()=>{ if(raf) cancelAnimationFrame(raf); cv.style.opacity=0;
      setTimeout(()=>cv.remove(),650); },(ms||4200)+400);
  }catch(e){}
}
const clearConfetti=()=>{ const c=document.getElementById('confetti'); if(c) c.remove(); };
/* a full house needs waking within five minutes, so it is nearly always morning —
   but not always, and greeting him with the wrong time of day would be worse than none */
const medHail=h=>(h<12?{a:'Good morning, André.',b:'Well done.'}

let medWakeLock=null;
async function keepAwake(on){

}

/* the capture form, the running timer, and editing a sitting already saved */
function viewMeditate(M,editId){
  setTab('home');
  const edit=editId?S.entries.find(e=>e.id===editId&&e.type==='meditation'):null;
  if(editId&&!edit){ setBar('Meditation','home'); M.innerHTML='<p class="empty">Entry not found.</p>'; return; }
  const run=edit?null:readRun();
  let afterWake=edit?!!edit.afterWake:(run?!!run.afterWake:false);
  let outside=edit?!!edit.outside:(run?!!run.outside:false);
  let tick=null;
  const stop=()=>{ if(tick){ clearInterval(tick); tick=null; } keepAwake(false); releaseAudio(); };
  const done=async(timed)=>{
    stop(); clearRun(); buzz();
    const m={afterWake,outside,timed,date:todayStr()};
    const saved=await saveMeditation(m);
    const pts=medPoints(m);
    setBar('Meditation','home');
    /* a full house - awake, outside, sat down - deserves more than a number */
    const perfect=pts===3;
    const hail=medHail(new Date().getHours());
    if(perfect) confetti();
    let hush=null;
    const paint=()=>{
      const ringing=bellRinging();
      M.innerHTML=`<div class="card meddone${perfect?' perfect':''}">
          ${perfect?`<div class="medhail">${esc(hail.a)}${hail.b?'<br>'+esc(hail.b):''}</div>`:''}
          <div class="medbig">${pts} point${pts>1?'s':''}</div>
          <div class="cardsub">Meditation saved${timed?' · '+MED_MIN+' minutes':''}${
            afterWake?'<br>+1 within 5 minutes of waking':''}${outside?'<br>+1 outside in the sun':''}</div>
        </div>
        ${ringing?'<button class="btn" id="bHush">Stop the chime</button>':''}
        <button class="btn ${ringing?'secondary':''}" id="bClose"${ringing?' style="margin-top:10px"':''}>Done</button>
        <button class="btn secondary" id="bUndo" style="margin-top:10px">Delete this one</button>`;
      const leave=async(fn)=>{ cancelBell(); clearConfetti(); clearTimeout(hush); if(fn) await fn(); nav('home'); };

      $('#bClose').onclick=()=>leave(null);
      $('#bUndo').onclick=()=>leave(async()=>{ await deleteEntry(saved.id); toast('Deleted'); });
      /* drop the button by itself once the last note has died away */
      clearTimeout(hush);
      if(ringing) hush=setTimeout(paint,Math.max(300,medBellUntil-Date.now()+200));
    };
    paint();
  };
  const runView=(startedAt)=>{
    setBar('Meditating','home');
    const armed=audioLive();
    M.innerHTML=`<div class="card timerwrap">
        <div class="tclock" id="tClock">--:--</div>
        <div class="tbar"><i id="tFill"></i></div>
